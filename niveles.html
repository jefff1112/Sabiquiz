<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sabiquiz - Niveles</title>
    <link rel="stylesheet" href="css/design-system.css">
    <link rel="stylesheet" href="css/navbar.css">
    <style>
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--space-4);
            flex-wrap: wrap;
            gap: var(--space-3);
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--color-primary);
            text-decoration: none;
            font-weight: bold;
            font-size: 15px;
            padding: 10px 18px;
            border-radius: var(--radius-sm);
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .back-btn:hover {
            background: var(--color-bg);
            transform: translateX(-3px);
            color: var(--color-primary-dark);
        }
        
        .niveles-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: var(--space-4);
            margin-top: var(--space-5);
        }
        
        .nivel-card {
            padding: var(--space-5);
            border-radius: var(--radius-md);
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            border: 2px solid var(--color-border);
            background: var(--color-surface);
            box-shadow: var(--shadow-sm);
        }
        
        .nivel-card:hover:not(.bloqueado) {
            transform: translateY(-5px);
            box-shadow: var(--shadow-md);
        }
        
        .nivel-card.completado {
            background: #c6f6d5;
            border-color: var(--color-success);
        }
        
        .nivel-card.bloqueado {
            background: #fed7d7;
            border-color: var(--color-danger);
            cursor: not-allowed;
            opacity: 0.6;
        }
        
        .nivel-card.disponible {
            background: #bee3f8;
            border-color: var(--color-primary);
        }
        
        .nivel-card .estrellas {
            font-size: 20px;
            margin-top: var(--space-2);
            margin-bottom: var(--space-2);
        }

        .nivel-numero {
            font-size: 28px;
            font-weight: bold;
            color: var(--color-text);
            margin-bottom: var(--space-1);
        }

        .nivel-titulo {
            font-size: 14px;
            color: var(--color-text-muted);
            margin-bottom: var(--space-2);
        }
        
        .loading {
            text-align: center;
            padding: var(--space-6);
            color: var(--color-text-muted);
            font-size: 1.125rem;
            grid-column: 1/-1;
        }
    </style>
</head>
<body>
    <div id="navbar-container"></div>
    <script src="js/layout.js"></script>

    <main class="main-content">
        <div class="breadcrumb" id="breadcrumbNav">Inicio / Materia / Niveles</div>
        
        <div class="card" style="margin-top: var(--space-4);">
            <div class="page-header">
                <button class="back-btn" onclick="window.location.href='main_menu.html'">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                    Volver
                </button>
                <h1 id="materiaTitulo" style="margin: 0; color: var(--color-text);">Cargando niveles...</h1>
            </div>
            
            <div id="nivelesContainer" class="niveles-grid">
                <div class="loading">⏳ Cargando niveles...</div>
            </div>
        </div>
    </main>

    <script src="js/app.js"></script>
    <script>
        const API_URL = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') ? 'http://localhost:3000/api' : (window.location.origin + '/api');

        async function getToken() {
            return localStorage.getItem('token');
        }

        async function apiRequest(endpoint, options = {}) {
            const token = await getToken();
            const defaultOptions = {
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': token ? `Bearer ${token}` : ''
                }
            };
            const finalOptions = { ...defaultOptions, ...options };
            const response = await fetch(`${API_URL}${endpoint}`, finalOptions);
            return await response.json();
        }

        async function loadNiveles() {
            const params = new URLSearchParams(window.location.search);
            const materiaId = params.get('materiaId');
            
            if (!materiaId) {
                document.getElementById('materiaTitulo').textContent = 'Error: No se seleccionó materia';
                return;
            }

            try {
                // Obtener datos de la materia
                const materiasData = await apiRequest('/quiz/materias');
                const materia = materiasData.materias.find(m => m.id == materiaId);
                const materiaNombre = materia ? materia.nombre : 'Materia';
                document.getElementById('materiaTitulo').textContent = `Niveles de ${materiaNombre}`;
                document.getElementById('breadcrumbNav').textContent = `Inicio / ${materiaNombre} / Niveles`;

                // Obtener niveles
                const nivelesData = await apiRequest(`/quiz/materia/${materiaId}/niveles`);
                const progresoData = await apiRequest('/progress');

                const container = document.getElementById('nivelesContainer');
                container.innerHTML = '';

                nivelesData.niveles.forEach(nivel => {
                    // Buscar progreso de este nivel
                    let progresoNivel = null;
                    for (const [materia, niveles] of Object.entries(progresoData.progreso || {})) {
                        const encontrado = niveles.find(n => n.nivel === nivel.numero);
                        if (encontrado) {
                            progresoNivel = encontrado;
                            break;
                        }
                    }

                    const card = document.createElement('div');
                    card.className = 'nivel-card';
                    
                    let estado = 'disponible';
                    let estrellasHTML = '';

                    if (progresoNivel) {
                        if (progresoNivel.completado) {
                            estado = 'completado';
                            estrellasHTML = '⭐'.repeat(progresoNivel.estrellas || 0);
                        }
                    } else {
                        // Si no hay progreso, está disponible
                        estado = 'disponible';
                    }

                    card.className = `nivel-card ${estado}`;
                    card.innerHTML = `
                        <div class="nivel-numero">${nivel.numero}</div>
                        <div class="nivel-titulo">${nivel.titulo || `Nivel ${nivel.numero}`}</div>
                        <div class="estrellas">${estrellasHTML || '🔒'}</div>
                        ${estado === 'completado' ? '<span style="color: var(--color-success); font-weight: bold;">✅ Completado</span>' : ''}
                        ${estado === 'bloqueado' ? '<span style="color: var(--color-danger); font-weight: bold;">🔒 Bloqueado</span>' : ''}
                        ${estado === 'disponible' ? '<span style="color: var(--color-primary); font-weight: bold;">🎮 Jugar</span>' : ''}
                    `;

                    // Solo permitir clic si está disponible o completado (para rejugar)
                    if (estado !== 'bloqueado') {
                        card.onclick = () => {
                            localStorage.setItem('selectedNivelId', nivel.id);
                            window.location.href = `quiz_runner.html?nivel=${nivel.id}`;
                        };
                    }

                    container.appendChild(card);
                });
            } catch (error) {
                console.error('Error cargando niveles:', error);
                document.getElementById('nivelesContainer').innerHTML = `
                    <div style="grid-column: 1/-1; text-align: center; color: var(--color-danger); padding: var(--space-6);">
                        ❌ Error al cargar niveles: ${error.message}
                    </div>
                `;
            }
        }

        document.addEventListener('DOMContentLoaded', loadNiveles);
    </script>
    <script src="js/sabi_injector.js"></script>
</body>
</html>
