<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minijuegos - Matemáticas</title>
    <link rel="stylesheet" href="../css/styles.css">
    <style>
        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .game-card {
            background: #f7fafc;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            border: 2px solid transparent;
            text-decoration: none;
            color: inherit;
        }
        .game-card:hover:not(.locked) {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            border-color: #667eea;
        }
        .game-card .icon { font-size: 40px; display: block; }
        .game-card h4 { margin: 10px 0 5px; color: #2d3748; }
        .game-card p { color: #718096; font-size: 13px; }
        .game-card .badge {
            display: inline-block;
            padding: 2px 12px;
            border-radius: 12px;
            font-size: 12px;
            margin-top: 5px;
        }
        .game-card.locked { opacity: 0.6; cursor: not-allowed; }
        .game-card.locked:hover { transform: none; border-color: #e2e8f0; }
        .unlock-info { font-size: 12px; color: #a0aec0; margin-top: 8px; }
        .back-btn {
            display: inline-block;
            margin-bottom: 20px;
            color: #667eea;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
        }
        .back-btn:hover { text-decoration: underline; }
        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 30px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        h3 { text-align: center; color: #2d3748; font-size: 28px; }
        .loading-text { text-align: center; color: #718096; padding: 40px; }
    </style>
</head>
<body>
    <div class="container">
        <a href="matematicas.html" class="back-btn">← Volver a Matemáticas</a>
        <h3>🎮 Minijuegos de Matemáticas</h3>
        <p style="text-align:center; color:#718096;">Completa ciertos niveles de Quizzes para desbloquear cada minijuego.</p>

        <div class="game-grid" id="gameGrid">
            <div class="loading-text">Cargando minijuegos...</div>
        </div>
    </div>

    <script>
        // ============================================
        // CONFIGURACIÓN DE LA API
        // ============================================
        const API_URL = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') ? 'http://localhost:3000/api' : (window.location.origin + '/api');

        function getToken() { return localStorage.getItem('token'); }

        async function apiRequest(endpoint, options = {}) {
            const token = getToken();
            const headers = {
                'Content-Type': 'application/json',
                'Authorization': token ? `Bearer ${token}` : ''
            };
            const finalOptions = { ...options, headers: { ...headers, ...options.headers } };
            const response = await fetch(`${API_URL}${endpoint}`, finalOptions);
            if (!response.ok) {
                if (response.status === 401) {
                    localStorage.removeItem('token');
                    localStorage.removeItem('user');
                    window.location.href = '../login.html';
                }
                throw new Error(await response.text());
            }
            return await response.json();
        }

        function normalizarTexto(texto) {
            return texto.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
        }

        // ============================================
        // LISTA DE MINIJUEGOS
        // nivelRequerido = número de nivel de QUIZ de Matemáticas necesario
        // ============================================
        const minijuegos = [
            { id: 'puzzle',   nombre: '🧩 Puzzle Geométrico',          icon: '🧩', nivelRequerido: 5,  url: 'puzzle.html' },
            { id: 'balanzas', nombre: '⚖️ Balanzas de Ecuaciones',     icon: '⚖️', nivelRequerido: 15, url: 'balanzas.html' },
            { id: 'tiro',     nombre: '🚀 Tiro Parabólico',            icon: '🚀', nivelRequerido: 25, url: 'tiro.html' },
            { id: 'regresion',nombre: '📈 Regresión y Predicción',     icon: '📈', nivelRequerido: 30, url: 'regresion.html' }
        ];

        // ============================================
        // CARGAR PROGRESO DE QUIZZES Y RENDERIZAR
        // ============================================
        async function loadMinijuegos() {
            const grid = document.getElementById('gameGrid');
            try {
                // Obtener progreso de quizzes (materia Matemáticas)
                const progressData = await apiRequest('/progress');

                // Máximo número de nivel de quiz completado (usamos "nivel" = numero 1-30)
                let maxNivelCompletado = 0;
                if (progressData.success && progressData.progreso) {
                    for (const [materia, niveles] of Object.entries(progressData.progreso)) {
                        if (normalizarTexto(materia) === 'matematicas') {
                            niveles.forEach(n => {
                                if (n.completado && typeof n.nivel === 'number' && n.nivel > maxNivelCompletado) {
                                    maxNivelCompletado = n.nivel;
                                }
                            });
                            break;
                        }
                    }
                }

                grid.innerHTML = '';
                minijuegos.forEach(juego => {
                    const card = document.createElement('div');
                    card.className = 'game-card';
                    const isUnlocked = maxNivelCompletado >= juego.nivelRequerido;

                    if (!isUnlocked) {
                        card.classList.add('locked');
                        card.innerHTML = `
                            <span class="icon">${juego.icon}</span>
                            <h4>${juego.nombre}</h4>
                            <span class="badge" style="background:#fc8181;color:white;">🔒 Bloqueado</span>
                            <div class="unlock-info">Completa el Nivel ${juego.nivelRequerido} de Quizzes</div>
                        `;
                    } else {
                        card.innerHTML = `
                            <span class="icon">${juego.icon}</span>
                            <h4>${juego.nombre}</h4>
                            <span class="badge" style="background:#48bb78;color:white;">✅ Desbloqueado</span>
                        `;
                        card.onclick = () => { window.location.href = juego.url; };
                    }
                    grid.appendChild(card);
                });

            } catch (error) {
                console.error('Error cargando minijuegos:', error);
                grid.innerHTML = '<p style="color:#fc8181;">Error al cargar los minijuegos. Intenta nuevamente.</p>';
            }
        }

        document.addEventListener('DOMContentLoaded', loadMinijuegos);
    </script>
</body>
</html>
