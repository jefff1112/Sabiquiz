<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF药店-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puzzle Geométrico</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #f0f4f8;
            font-family: 'Segoe UI', sans-serif;
        }
        .game-container {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 600px;
        }
        canvas {
            border: 2px solid #ccc;
            border-radius: 12px;
            background: #fafafa;
            cursor: grab;
        }
        canvas:active {
            cursor: grabbing;
        }
        .pieces {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        .piece {
            width: 60px;
            height: 60px;
            background: #667eea;
            color: white;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            cursor: grab;
            user-select: none;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }
        .piece:hover {
            transform: scale(1.05);
        }
        .piece:active {
            cursor: grabbing;
        }
        .feedback {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
        }
        .next-btn {
            margin-top: 15px;
            padding: 10px 30px;
            background: #48bb78;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            display: none;
        }
        .next-btn:hover {
            background: #38a169;
        }
        .stars {
            display: flex;
            justify-content: center;
            gap: 5px;
            margin-top: 10px;
        }
        .star {
            font-size: 30px;
            color: #e2e8f0;
        }
        .star.filled {
            color: #f6ad55;
        }
        .level-title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
<div class="game-container">
    <div class="level-title">🧩 Nivel <span id="levelNum">6</span></div>
    <div class="stars" id="starsContainer">
        <span class="star" id="star1">⭐</span>
        <span class="star" id="star2">⭐</span>
        <span class="star" id="star3">⭐</span>
    </div>
    <canvas id="gameCanvas" width="500" height="300"></canvas>
    <div class="pieces" id="piecesContainer"></div>
    <div class="feedback" id="feedback"></div>
    <button class="next-btn" id="nextBtn">Siguiente nivel ➜</button>
</div>
<script>
    // ============================================
    // PUZZLE GEOMÉTRICO - LÓGICA
    // ============================================
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const piecesContainer = document.getElementById('piecesContainer');
    const feedback = document.getElementById('feedback');
    const nextBtn = document.getElementById('nextBtn');
    const levelNumSpan = document.getElementById('levelNum');
    const star1 = document.getElementById('star1');
    const star2 = document.getElementById('star2');
    const star3 = document.getElementById('star3');

    // Configuración de niveles (5 niveles)
    const levels = [
        { // Nivel 6
            shape: 'triangle',
            piece: 'triangle',
            label: '🔺',
            clue: 'Completa el triángulo'
        },
        { // Nivel 7
            shape: 'square',
            piece: 'square',
            label: '⬛',
            clue: 'Completa el cuadrado'
        },
        { // Nivel 8
            shape: 'pentagon',
            piece: 'pentagon',
            label: '⬠',
            clue: 'Completa el pentágono'
        },
        { // Nivel 9
            shape: 'rectangle',
            piece: 'rectangle',
            label: '▭',
            clue: 'Completa el rectángulo'
        },
        { // Nivel 10
            shape: 'circle',
            piece: 'circle',
            label: '●',
            clue: 'Completa el círculo'
        }
    ];

    let currentLevel = 0; // 0-4 (corresponde a niveles 6-10)
    let starsEarned = 0;
    let isCompleted = false;
    let draggedPiece = null;
    let offsetX, offsetY;

    // ============================================
    // DIBUJAR EL CANVAS
    // ============================================
    function drawCanvas(level) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        // Dibujar el "hueco" (forma a completar)
        ctx.fillStyle = '#e2e8f0';
        ctx.strokeStyle = '#a0aec0';
        ctx.lineWidth = 2;

        const cx = canvas.width / 2;
        const cy = canvas.height / 2;
        const size = 60;

        switch(level.shape) {
            case 'triangle':
                ctx.beginPath();
                ctx.moveTo(cx, cy - size);
                ctx.lineTo(cx - size, cy + size/2);
                ctx.lineTo(cx + size, cy + size/2);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
                break;
            case 'square':
                ctx.fillRect(cx - size/2, cy - size/2, size, size);
                ctx.strokeRect(cx - size/2, cy - size/2, size, size);
                break;
            case 'pentagon':
                ctx.beginPath();
                for (let i = 0; i < 5; i++) {
                    const angle = (i * 2 * Math.PI / 5) - Math.PI/2;
                    const x = cx + size * 0.8 * Math.cos(angle);
                    const y = cy + size * 0.8 * Math.sin(angle);
                    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
                }
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
                break;
            case 'rectangle':
                ctx.fillRect(cx - size, cy - size/2, size*1.5, size);
                ctx.strokeRect(cx - size, cy - size/2, size*1.5, size);
                break;
            case 'circle':
                ctx.beginPath();
                ctx.arc(cx, cy, size/1.5, 0, 2 * Math.PI);
                ctx.fill();
                ctx.stroke();
                break;
        }

        // Si está completado, mostrar mensaje
        if (isCompleted) {
            ctx.fillStyle = 'rgba(72, 187, 120, 0.3)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#276749';
            ctx.font = 'bold 30px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('✅ ¡Completado!', canvas.width/2, 50);
        }
    }

    // ============================================
    // GENERAR PIEZAS (arrastrables)
    // ============================================
    function generatePieces(level) {
        piecesContainer.innerHTML = '';
        // Crear 4 piezas, una correcta y 3 incorrectas
        const correct = level.piece;
        const allPieces = ['triangle', 'square', 'pentagon', 'rectangle', 'circle'];
        const options = allPieces.filter(p => p !== correct);
        // Mezclar y tomar 3 incorrectas
        const shuffled = options.sort(() => Math.random() - 0.5).slice(0, 3);
        const pieces = [correct, ...shuffled].sort(() => Math.random() - 0.5);

        pieces.forEach(p => {
            const div = document.createElement('div');
            div.className = 'piece';
            div.dataset.shape = p;
            div.textContent = getShapeLabel(p);
            div.draggable = true;
            div.addEventListener('dragstart', (e) => {
                e.dataTransfer.setData('text/plain', p);
            });
            div.addEventListener('dragend', (e) => {
                // No hacer nada
            });
            piecesContainer.appendChild(div);
        });
    }

    function getShapeLabel(shape) {
        const map = {
            triangle: '🔺',
            square: '⬛',
            pentagon: '⬠',
            rectangle: '▭',
            circle: '●'
        };
        return map[shape] || '?';
    }

    // ============================================
    // MANEJAR EL DROP EN EL CANVAS
    // ============================================
    canvas.addEventListener('dragover', (e) => {
        e.preventDefault();
    });

    canvas.addEventListener('drop', (e) => {
        e.preventDefault();
        if (isCompleted) return;
        const shape = e.dataTransfer.getData('text/plain');
        const level = levels[currentLevel];
        if (shape === level.piece) {
            // Correcto
            isCompleted = true;
            starsEarned = Math.min(starsEarned + 1, 3);
            updateStars();
            feedback.textContent = '✅ ¡Correcto! Has completado el puzzle.';
            feedback.style.color = '#48bb78';
            nextBtn.style.display = 'block';
            drawCanvas(level);
            // Guardar progreso (llamar a tu API aquí)
            saveProgress(level.id, starsEarned);
        } else {
            feedback.textContent = '❌ Eso no encaja aquí. Intenta con otra pieza.';
            feedback.style.color = '#fc8181';
        }
    });

    // ============================================
    // ACTUALIZAR ESTRELLAS
    // ============================================
    function updateStars() {
        const stars = [star1, star2, star3];
        stars.forEach((s, i) => {
            s.textContent = i < starsEarned ? '⭐' : '☆';
            s.style.color = i < starsEarned ? '#f6ad55' : '#e2e8f0';
        });
    }

    // ============================================
    // GUARDAR PROGRESO (API)
    // ============================================
    async function saveProgress(levelId, stars) {
        // Usa tu función apiRequest existente
        try {
            const token = localStorage.getItem('token');
            const response = await fetch('/api/quiz/submit', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({
                    nivelId: levelId,
                    respuestas: [],
                    tiempo: 0,
                    estrellas: stars
                })
            });
            const data = await response.json();
            console.log('Progreso guardado:', data);
        } catch (error) {
            console.error('Error guardando progreso:', error);
        }
    }

    // ============================================
    // INICIALIZAR NIVEL
    // ============================================
    function loadLevel(index) {
        const level = levels[index];
        levelNumSpan.textContent = index + 6; // Niveles 6-10
        isCompleted = false;
        starsEarned = 0;
        updateStars();
        feedback.textContent = level.clue;
        feedback.style.color = '#4a5568';
        nextBtn.style.display = 'none';
        drawCanvas(level);
        generatePieces(level);
    }

    // ============================================
    // SIGUIENTE NIVEL
    // ============================================
    nextBtn.addEventListener('click', () => {
        if (currentLevel < levels.length - 1) {
            currentLevel++;
            loadLevel(currentLevel);
        } else {
            feedback.textContent = '🎉 ¡Has completado todos los puzzles geométricos!';
            feedback.style.color = '#48bb78';
            nextBtn.style.display = 'none';
            // Redirigir o mostrar mensaje final
        }
    });

    // ============================================
    // INICIAR
    // ============================================
    loadLevel(0);
</script>
</body>
</html>
