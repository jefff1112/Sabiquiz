<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Torneos - Sabiquiz</title>
    <link rel="stylesheet" href="css/design-system.css">
    <link rel="stylesheet" href="css/navbar.css">
</head>
<body>
    <div id="navbar-container"></div>
    
    <main class="main-content">
        <div class="container-wide">
            <!-- BREADCRUMB -->
            <nav class="breadcrumb" aria-label="Navegación">
                <a href="main_menu.html">Inicio</a>
                <span class="separator">/</span>
                <span aria-current="page">Torneos</span>
            </nav>

            <!-- HEADER -->
            <header class="dashboard-header animate-in">
                <h1><img src="img/trofeo.png" class="icon-btn" style="width:28px;height:28px;"> Torneos Feria CIMAT 2026</h1>
                <p class="muted">Compite por materia y gana recompensas exclusivas</p>
            </header>



            <!-- FILTER TABS -->
            <div class="card animate-in animate-delay-2">
                <div class="tabs" id="filterTabs" role="tablist">
                    <button class="tab active" data-filter="all" role="tab" aria-selected="true">Todos</button>
                    <button class="tab" data-filter="inscripcion_abierta" role="tab" aria-selected="false">Inscripciones Abiertas</button>
                    <button class="tab" data-filter="en_curso" role="tab" aria-selected="false">En Curso</button>
                    <button class="tab" data-filter="proximo" role="tab" aria-selected="false">Próximos</button>
                    <button class="tab" data-filter="finalizado" role="tab" aria-selected="false">Finalizados</button>
                </div>
            </div>

            <!-- TOURNAMENT GRID -->
            <section class="animate-in animate-delay-3">
                <div class="grid grid-2 tournament-grid" id="tournamentGrid">
                    <!-- Tournament cards will be rendered here -->
                </div>
            </section>
        </div>
    </main>

    <script src="js/layout.js"></script>
    <script src="js/sabi_injector.js"></script>
    <script>
        // ============================================
        // CONFIGURACIÓN
        // ============================================
        const API_URL = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') 
            ? 'http://localhost:3000/api' 
            : (window.location.origin + '/api');

        function getToken() { return localStorage.getItem('token'); }

        async function apiRequest(endpoint, options = {}) {
            const token = getToken();
            const headers = { 
                'Content-Type': 'application/json', 
                'Authorization': token ? 'Bearer ' + token : '' 
            };
            const finalOptions = { ...options, headers: { ...headers, ...options.headers } };
            const response = await fetch(API_URL + endpoint, finalOptions);
            if (!response.ok) {
                if (response.status === 401) { 
                    localStorage.removeItem('token'); 
                    window.location.href = 'login.html'; 
                }
                throw new Error(await response.text());
            }
            return await response.json();
        }

        function checkAuth() { 
            if (!getToken()) { window.location.href = 'login.html'; return false; } 
            return true; 
        }

        function formatDate(dateStr) {
            const date = new Date(dateStr);
            return date.toLocaleDateString('es-ES', { 
                weekday: 'long', day: 'numeric', month: 'long', 
                hour: '2-digit', minute: '2-digit' 
            });
        }

        function getTimeUntil(dateStr) {
            const now = new Date();
            const target = new Date(dateStr);
            const diff = target - now;
            
            if (diff <= 0) return { text: 'Ya comenzó', urgent: false };
            
            const hours = Math.floor(diff / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            
            if (hours > 0) {
                return { text: `${hours}h ${minutes}m`, urgent: hours < 1 };
            }
            return { text: `${minutes}m`, urgent: minutes <= 5 };
        }

        function getEstadoText(estado) {
            const texts = {
                'proximo': '📅 Próximo',
                'inscripcion_abierta': '✍️ Inscripciones Abiertas',
                'en_curso': '🔴 EN CURSO',
                'finalizado': '🏁 Finalizado'
            };
            return texts[estado] || estado;
        }

        function getEstadoClass(estado) {
            const classes = {
                'proximo': 'status-proximo',
                'inscripcion_abierta': 'status-inscripcion',
                'en_curso': 'status-en_curso',
                'finalizado': 'status-finalizado'
            };
            return classes[estado] || '';
        }

        function createTournamentCard(torneo) {
            const card = document.createElement('div');
            card.className = 'card tournament-card animate-in';
            card.dataset.estado = torneo.estado;
            
            const timeInfo = getTimeUntil(torneo.fecha_inicio);
            const isInscrito = torneo.inscrito;
            const canInscribirse = torneo.puedeInscribirse;
            
            let statusClass = getEstadoClass(torneo.estado);
            let statusText = getEstadoText(torneo.estado);

            let btnHTML = '';
            if (torneo.estado === 'proximo') {
                btnHTML = `<button class="btn btn-ghost btn-block" disabled>Próximamente</button>`;
            } else if (torneo.estado === 'inscripcion_abierta') {
                if (isInscrito) {
                    btnHTML = `<button class="btn btn-success btn-block" disabled>✅ Inscrito</button>`;
                } else if (canInscribirse) {
                    btnHTML = `<button class="btn btn-primary btn-block" onclick="inscribirse(${torneo.id})">🏆 Inscribirme</button>`;
                } else {
                    btnHTML = `<button class="btn btn-ghost btn-block" disabled>Completo</button>`;
                }
            } else if (torneo.estado === 'en_curso') {
                if (isInscrito) {
                    btnHTML = `<a href="torneo_detalle.html?id=${torneo.id}" class="btn btn-success btn-block">🎮 Jugar Partida</a>`;
                } else {
                    btnHTML = `<button class="btn btn-ghost btn-block" disabled>Ya iniciado</button>`;
                }
            } else if (torneo.estado === 'finalizado') {
                btnHTML = `<a href="torneo_detalle.html?id=${torneo.id}" class="btn btn-secondary btn-block">🏆 Ver Ranking</a>`;
            }

            const countdownHTML = torneo.estado === 'inscripcion_abierta' 
                ? `<div class="countdown ${timeInfo.urgent ? 'urgent' : ''}" style="display:inline-flex;align-items:center;gap:6px;background:#fef3c7;color:#d97706;padding:6px 12px;border-radius:999px;font-weight:700;font-size:13px;margin-bottom:var(--space-3);">⏰ Inicia en: ${timeInfo.text}</div>`
                : torneo.estado === 'proximo'
                ? `<div class="countdown" style="display:inline-flex;align-items:center;gap:6px;background:#eef2ff;color:#667eea;padding:6px 12px;border-radius:999px;font-weight:700;font-size:13px;margin-bottom:var(--space-3);">📅 ${formatDate(torneo.fecha_inicio)}</div>`
                : '';

            const progresoPorcentaje = torneo.max_usuarios > 0 ? (torneo.inscritos / torneo.max_usuarios * 100) : 0;

            card.innerHTML = `
                <div class="tournament-status ${statusClass}" style="display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:999px;font-size:12px;font-weight:700;margin-bottom:var(--space-3);">${statusText}</div>
                <h3 class="tournament-name" style="font-size:18px;font-weight:700;color:var(--color-text);margin-bottom:var(--space-2);">${torneo.nombre}</h3>
                <div class="tournament-meta" style="display:flex;flex-direction:column;gap:8px;margin-bottom:var(--space-4);font-size:13px;color:var(--color-text-muted);">
                    <span style="display:flex;align-items:center;gap:8px;"><img src="${torneo.materia_icono || 'img/mat.png'}" style="width:16px;height:16px;"> <strong>Materia:</strong> ${torneo.materia_nombre}</span>
                    <span style="display:flex;align-items:center;gap:8px;">⏱️ <strong>Duración:</strong> ${torneo.duracion_minutos} min (5 partidas)</span>
                    <span style="display:flex;align-items:center;gap:8px;">👥 <strong>Participantes:</strong> ${torneo.inscritos}/${torneo.max_usuarios}</span>
                    <span style="display:flex;align-items:center;gap:8px;">🎮 <strong>Modo:</strong> ${torneo.modo === 'acumulativo' ? 'Acumulativo' : torneo.modo}</span>
                </div>
                ${countdownHTML}
                <div class="progress-bar" style="height:8px;background:var(--color-border);border-radius:999px;overflow:hidden;margin-bottom:var(--space-3);">
                    <div class="progress-fill" style="width:${progresoPorcentaje}%;height:100%;background:var(--color-primary-gradient);border-radius:999px;transition:width 0.5s ease;"></div>
                </div>
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--space-3);font-size:13px;color:var(--color-text-muted);">
                    <span>${torneo.inscritos}/${torneo.max_usuarios}</span>
                </div>
                ${btnHTML}
            `;
            return card;
        }

        async function loadTorneos() {
            if (!checkAuth()) return;
            const grid = document.getElementById('tournamentGrid');
            grid.innerHTML = '<div class="loading-text" style="grid-column:1/-1;text-align:center;padding:40px;"><div class="spinner" style="margin:0 auto 16px;width:40px;height:40px;border:4px solid var(--color-border);border-top-color:var(--color-primary-500);border-radius:50%;animation:spin 0.8s linear infinite;"></div>Cargando torneos...</div>';
            
            try {
                const data = await apiRequest('/torneos');
                if (data.success) {
                    renderTorneos(data.torneos);
                } else {
                    throw new Error(data.error);
                }
            } catch (error) {
                console.error('Error cargando torneos:', error);
                grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--color-text-muted);"><img src="img/incorrect.png" style="width:100px;margin-bottom:16px;opacity:0.5;"><h3 style="color:var(--color-text);">Error al cargar torneos</h3><p>Intenta recargar la página</p></div>';
            }
        }

        function renderTorneos(torneos) {
            const grid = document.getElementById('tournamentGrid');
            const activeFilter = document.querySelector('.tab.active')?.dataset.filter || 'all';
            
            const filtered = torneos.filter(t => 
                activeFilter === 'all' || t.estado === activeFilter
            );

            if (filtered.length === 0) {
                grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--color-text-muted);"><img src="img/trofeo.png" style="width:100px;margin-bottom:16px;opacity:0.5;"><h3 style="color:var(--color-text);">No hay torneos</h3><p>No se encontraron torneos con este filtro</p></div>';
                return;
            }

            grid.innerHTML = '';
            filtered.forEach((t, index) => {
                const card = createTournamentCard(t);
                card.style.animationDelay = `${index * 100}ms`;
                grid.appendChild(card);
            });
        }

        async function inscribirse(torneoId) {
            try {
                const data = await apiRequest('/torneos/' + torneoId + '/inscribirse', { method: 'POST' });
                if (data.success) {
                    showToast('✅ ¡Inscrito correctamente! Recibirás un recordatorio antes de empezar.');
                    loadTorneos();
                } else {
                    showToast('❌ ' + data.error, 'error');
                }
            } catch (error) {
                console.error('Error inscribiéndose:', error);
                showToast('❌ Error al inscribirse', 'error');
            }
        }

        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            toast.style.cssText = `
                position: fixed; bottom: 24px; right: 24px; z-index: 9999;
                padding: 16px 24px; border-radius: var(--radius-lg); font-weight: 600;
                background: ${type === 'success' ? 'var(--color-accent-green)' : 'var(--color-accent-red)'};
                color: white; box-shadow: var(--shadow-lg);
                animation: slideIn 0.3s ease;
            `;
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => { 
                toast.style.opacity = '0'; 
                toast.style.transition = 'opacity 0.3s'; 
                setTimeout(() => toast.remove(), 300); 
            }, 3000);
        }

        // Filtros
        document.getElementById('filterTabs')?.addEventListener('click', (e) => {
            if (e.target.classList.contains('tab')) {
                document.querySelectorAll('.tab').forEach(t => {
                    t.classList.remove('active');
                    t.setAttribute('aria-selected', 'false');
                });
                e.target.classList.add('active');
                e.target.setAttribute('aria-selected', 'true');
                loadTorneos();
            }
        });

        // Sabi Challenge Card
        document.getElementById('challengeSabiCard')?.addEventListener('click', (e) => {
            e.preventDefault();
            if (window.SabiquizLayout && typeof window.SabiquizLayout.toggleSabiChat === 'function') {
                window.SabiquizLayout.toggleSabiChat();
            } else if (window.SabiInjector && typeof window.SabiInjector.inyectar === 'function') {
                window.SabiInjector.inyectar();
            }
        });

        // Auto-refresh cada 30 segundos
        setInterval(loadTorneos, 30000);

        document.addEventListener('DOMContentLoaded', () => {
            if (!checkAuth()) return;
            loadTorneos();
        });
    </script>
    <style>
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        
        .status-proximo { background: #eef2ff; color: #667eea; }
        .status-inscripcion { background: #fef3c7; color: #d97706; }
        .status-en_curso { background: #dcfce7; color: #16a34a; animation: pulse 2s infinite; }
        .status-finalizado { background: #f1f5f9; color: #64748b; }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        @media (max-width: 768px) {
            .grid-2 { grid-template-columns: 1fr; }
            .tabs { overflow-x: auto; }
        }
    </style>
</body>
</html>
