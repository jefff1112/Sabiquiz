<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sabiquiz - Recuperar Contraseña</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 450px;
            width: 100%;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        .container h1 {
            text-align: center;
            color: #2d3748;
            margin-bottom: 5px;
            font-size: 28px;
        }
        .container h1 span {
            color: #667eea;
        }
        .container .subtitle {
            text-align: center;
            color: #718096;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-weight: bold;
            color: #4a5568;
            margin-bottom: 5px;
        }
        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 16px;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }
        .form-group input:focus {
            border-color: #667eea;
            outline: none;
        }
        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }
        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .btn-back {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #667eea;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
        }
        .btn-back:hover {
            text-decoration: underline;
        }
        .message {
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
            font-weight: bold;
            text-align: center;
        }
        .message.success {
            background: #c6f6d5;
            color: #276749;
            display: block;
        }
        .message.error {
            background: #fed7d7;
            color: #c53030;
            display: block;
        }
        .message.info {
            background: #ebf4ff;
            color: #2b6cb0;
            display: block;
        }
        .back-to-login {
            text-align: center;
            margin-top: 20px;
            color: #4a5568;
        }
        .back-to-login a {
            color: #667eea;
            text-decoration: none;
            font-weight: bold;
        }
        .back-to-login a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📚 <span>Sabiquiz</span></h1>
        <p class="subtitle">Recupera tu contraseña</p>

        <div id="messageBox" class="message"></div>

        <form id="forgotForm">
            <div class="form-group">
                <label for="email">📧 Correo Electrónico</label>
                <input type="email" id="email" placeholder="ejemplo@correo.com" required>
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">📨 Enviar Instrucciones</button>
        </form>

        <div class="back-to-login">
            ¿Recordaste tu contraseña? <a href="login.html">Inicia sesión aquí</a>
        </div>
    </div>

    <script>
        // ============================================
        // CONFIGURACIÓN DE LA API
        // ============================================
        const API_URL = 'http://localhost:3000/api';

        // ============================================
        // FUNCIONES DE UI
        // ============================================
        function showMessage(message, type = 'info') {
            const box = document.getElementById('messageBox');
            box.textContent = message;
            box.className = `message ${type}`;
            box.style.display = 'block';
        }

        function hideMessage() {
            const box = document.getElementById('messageBox');
            box.style.display = 'none';
            box.className = 'message';
        }

        function setLoading(loading) {
            const btn = document.getElementById('submitBtn');
            btn.disabled = loading;
            btn.textContent = loading ? '⏳ Enviando...' : '📨 Enviar Instrucciones';
        }

        // ============================================
        // ENVIAR FORMULARIO
        // ============================================
        document.getElementById('forgotForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            hideMessage();

            const email = document.getElementById('email').value.trim();

            if (!email) {
                showMessage('Por favor, ingresa tu correo electrónico', 'error');
                return;
            }

            try {
                setLoading(true);
                showMessage('⏳ Enviando solicitud...', 'info');

                const response = await fetch(`${API_URL}/auth/forgot-password`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email })
                });

                const data = await response.json();

                if (data.success) {
                    showMessage('✅ ' + data.message, 'success');
                    document.getElementById('email').value = '';
                } else {
                    showMessage('❌ ' + data.error, 'error');
                }
            } catch (error) {
                console.error('Error:', error);
                showMessage('❌ Error al conectar con el servidor', 'error');
            } finally {
                setLoading(false);
            }
        });

        // Permitir Enter
        document.getElementById('email').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                document.getElementById('forgotForm').dispatchEvent(new Event('submit'));
            }
        });
    </script>
</body>
</html>
