<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sabiquiz - Sugerir Pregunta</title>
    <link rel="stylesheet" href="css/design-system.css">
    <link rel="stylesheet" href="css/navbar.css">
    <style>
        .message {
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
            font-weight: bold;
            text-align: center;
        }
        .message.success {
            background: #c6f6d5;
            color: #276749;
            display: block;
        }
        .message.error {
            background: #fed7d7;
            color: #c53030;
            display: block;
        }
        .message.loading {
            background: #ebf4ff;
            color: #2b6cb0;
            display: block;
        }
        .char-counter {
            text-align: right;
            font-size: 12px;
            color: var(--color-text-muted);
            margin-top: 4px;
        }
        .options-grid-input {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        @media (max-width: 600px) {
            .options-grid-input {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div id="navbar-container"></div>
    
    <main class="main-content">
        <div class="container-wide">
            <!-- BREADCRUMB -->
            <nav class="breadcrumb" aria-label="Navegación">
                <a href="main_menu.html">Inicio</a>
                <span class="separator">/</span>
                <span aria-current="page">Sugerir Pregunta</span>
            </nav>

            <!-- HEADER -->
            <header class="dashboard-header animate-in">
                <h1><img src="img/sabi/sabi_pensando.png" class="icon-btn" style="width:32px;height:32px;vertical-align:middle;"> Sugerir Pregunta</h1>
                <p class="muted">Comparte tu conocimiento con la comunidad Sabiquiz</p>
            </header>

            <div class="card suggest-container animate-in animate-delay-1" style="max-width: 700px; margin: 0 auto;">
                <div id="messageBox" class="message"></div>

                <form id="suggestionForm">
                    <!-- Materia -->
                    <div class="form-group" style="margin-bottom: var(--space-4);">
                        <label for="materiaId" class="form-label"><img src="img/lenguaje.png" class="icon-btn" style="width:20px;vertical-align:middle;"> Materia</label>
                        <select id="materiaId" class="form-input" required>
                            <option value="">Selecciona una materia</option>
                        </select>
                    </div>

                    <!-- Pregunta -->
                    <div class="form-group" style="margin-bottom: var(--space-4);">
                        <label for="pregunta" class="form-label"><img src="img/sabi/sabi_curioso.png" class="icon-btn" style="width:20px;vertical-align:middle;"> Pregunta</label>
                        <textarea id="pregunta" class="form-input" placeholder="Escribe tu pregunta aquí..." required maxlength="500" style="resize:vertical; min-height:80px;"></textarea>
                        <div class="char-counter"><span id="charCount">0</span>/500</div>
                    </div>

                    <!-- Opciones -->
                    <div class="form-group" style="margin-bottom: var(--space-4);">
                        <label class="form-label"><img src="img/control.png" class="icon-btn" style="width:20px;vertical-align:middle;"> Opciones de respuesta</label>
                        <div class="options-grid-input">
                            <input type="text" id="opcion1" class="form-input opcion-input" placeholder="Opción A" required>
                            <input type="text" id="opcion2" class="form-input opcion-input" placeholder="Opción B" required>
                            <input type="text" id="opcion3" class="form-input opcion-input" placeholder="Opción C" required>
                            <input type="text" id="opcion4" class="form-input opcion-input" placeholder="Opción D" required>
                        </div>
                    </div>

                    <!-- Respuesta correcta -->
                    <div class="form-group" style="margin-bottom: var(--space-4);">
                        <label for="respuestaCorrecta" class="form-label"><img src="img/correct.png" class="icon-btn" style="width:20px;vertical-align:middle;"> Respuesta correcta</label>
                        <select id="respuestaCorrecta" class="form-input" required>
                            <option value="0">Opción A</option>
                            <option value="1">Opción B</option>
                            <option value="2">Opción C</option>
                            <option value="3">Opción D</option>
                        </select>
                    </div>

                    <!-- Dificultad -->
                    <div class="form-group" style="margin-bottom: var(--space-5);">
                        <label for="dificultad" class="form-label"><img src="img/grafica.png" class="icon-btn" style="width:20px;vertical-align:middle;"> Dificultad</label>
                        <select id="dificultad" class="form-input">
                            <option value="easy">Fácil</option>
                            <option value="medium" selected>Media</option>
                            <option value="hard">Difícil</option>
                        </select>
                    </div>

                    <button type="submit" class="btn btn-primary" id="submitBtn" style="width:100%;"><img src="img/cohete.png" class="icon-btn" style="width:20px;vertical-align:middle;"> Enviar Sugerencia</button>
                </form>
            </div>
        </div>
    </main>

    <script src="js/layout.js"></script>
    <script>
        // ============================================
        // CONFIGURACIÓN DE LA API
        // ============================================
        const API_URL = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') ? 'http://localhost:3000/api' : (window.location.origin + '/api');

        // ============================================
        // FUNCIONES DE AUTENTICACIÓN
        // ============================================
        function getToken() {
            return localStorage.getItem('token');
        }

        function checkAuth() {
            const token = localStorage.getItem('token');
            if (!token) {
                window.location.href = 'login.html';
                return false;
            }
            return true;
        }

        // ============================================
        // FUNCIÓN PARA PETICIONES A LA API
        // ============================================
        async function apiRequest(endpoint, options = {}) {
            const token = getToken();
            const headers = {
                'Content-Type': 'application/json',
                'Authorization': token ? `Bearer ${token}` : ''
            };

            const finalOptions = {
                ...options,
                headers: {
                    ...headers,
                    ...options.headers || {}
                }
            };

            console.log(`📤 Enviando petición a: ${endpoint}`, finalOptions);

            try {
                const response = await fetch(`${API_URL}${endpoint}`, finalOptions);
                const data = await response.json();

                console.log(`📥 Respuesta:`, data);

                if (!response.ok) {
                    if (response.status === 401) {
                        localStorage.removeItem('token');
                        localStorage.removeItem('user');
                        window.location.href = 'login.html';
                    }
                    throw new Error(data.error || `Error ${response.status}: ${response.statusText}`);
                }

                return data;
            } catch (error) {
                console.error('❌ Error en apiRequest:', error);
                throw error;
            }
        }

        // ============================================
        // FUNCIONES DE UI
        // ============================================
        function showMessage(message, type = 'info') {
            const box = document.getElementById('messageBox');
            box.innerHTML = message;
            box.className = `message ${type}`;
            box.style.display = 'block';
        }

        function hideMessage() {
            const box = document.getElementById('messageBox');
            box.style.display = 'none';
            box.className = 'message';
        }

        function setLoading(loading) {
            const btn = document.getElementById('submitBtn');
            btn.disabled = loading;
            btn.innerHTML = loading ? '<img src="img/estrellas.png" class="icon-btn" style="width:20px;vertical-align:middle;"> Enviando...' : '<img src="img/cohete.png" class="icon-btn" style="width:20px;vertical-align:middle;"> Enviar Sugerencia';
        }

        // ============================================
        // CARGAR MATERIAS
        // ============================================
        async function loadMaterias() {
            try {
                const select = document.getElementById('materiaId');
                const data = await apiRequest('/quiz/materias');

                if (data.success && data.materias) {
                    select.innerHTML = '<option value="">Selecciona una materia</option>';
                    data.materias.forEach(m => {
                        const option = document.createElement('option');
                        option.value = m.id;
                        option.textContent = m.nombre;
                        select.appendChild(option);
                    });
                } else {
                    showMessage('Error al cargar las materias', 'error');
                }
            } catch (error) {
                console.error('Error cargando materias:', error);
                showMessage('Error al cargar las materias: ' + error.message, 'error');
            }
        }

        // ============================================
        // CONTADOR DE CARACTERES
        // ============================================
        document.getElementById('pregunta').addEventListener('input', function() {
            document.getElementById('charCount').textContent = this.value.length;
        });

        // ============================================
        // ENVIAR SUGERENCIA
        // ============================================
        document.getElementById('suggestionForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            hideMessage();

            if (!checkAuth()) return;

            const materiaId = document.getElementById('materiaId').value;
            const pregunta = document.getElementById('pregunta').value.trim();
            const opcion1 = document.getElementById('opcion1').value.trim();
            const opcion2 = document.getElementById('opcion2').value.trim();
            const opcion3 = document.getElementById('opcion3').value.trim();
            const opcion4 = document.getElementById('opcion4').value.trim();
            const correcta = parseInt(document.getElementById('respuestaCorrecta').value);
            const dificultad = document.getElementById('dificultad').value;

            if (!materiaId) {
                showMessage('Por favor, selecciona una materia', 'error');
                return;
            }

            if (pregunta.length < 5) {
                showMessage('La pregunta debe tener al menos 5 caracteres', 'error');
                return;
            }

            const opciones = [opcion1, opcion2, opcion3, opcion4];
            if (opciones.some(o => o.length < 1)) {
                showMessage('Todas las opciones deben tener al menos 1 carácter', 'error');
                return;
            }

            const opcionesSet = new Set(opciones.map(o => o.toLowerCase()));
            if (opcionesSet.size < 4) {
                showMessage('Las opciones deben ser diferentes', 'error');
                return;
            }

            const payload = {
                materiaId: parseInt(materiaId),
                pregunta: pregunta,
                opciones: opciones,
                correcta: correcta,
                dificultad: dificultad
            };

            console.log('📤 Enviando sugerencia:', payload);

            try {
                setLoading(true);
                showMessage('<img src="img/estrellas.png" class="icon-btn" style="width:20px;vertical-align:middle;"> Enviando tu sugerencia...', 'loading');

                const response = await apiRequest('/suggestions', {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });

                if (response.success) {
                    showMessage('<img src="img/correct.png" class="icon-btn" style="width:20px;vertical-align:middle;"> ¡Gracias! Tu pregunta ha sido enviada para revisión.', 'success');
                    document.getElementById('suggestionForm').reset();
                    document.getElementById('charCount').textContent = '0';
                    setLoading(false);
                } else {
                    showMessage('<img src="img/incorrect.png" class="icon-btn" style="width:20px;vertical-align:middle;"> Error al enviar: ' + (response.error || 'Error desconocido'), 'error');
                    setLoading(false);
                }
            } catch (error) {
                console.error('<img src="img/incorrect.png" class="icon-btn" style="width:20px;vertical-align:middle;"> Error:', error);
                showMessage('<img src="img/incorrect.png" class="icon-btn" style="width:20px;vertical-align:middle;"> Error al enviar la sugerencia: ' + error.message, 'error');
                setLoading(false);
            }
        });

        // ============================================
        // INICIALIZAR
        // ============================================
        document.addEventListener('DOMContentLoaded', async () => {
            if (!checkAuth()) return;
            await loadMaterias();
            console.log('✅ Página de sugerencias cargada');
        });

        // ============================================
        // AUTOCOMPLETADO CON SABI IA
        // ============================================
        window.addEventListener('sabiAutoFill', (e) => {
            const data = e.detail;
            
            if (data.pregunta) {
                const el = document.getElementById('pregunta');
                el.value = data.pregunta;
                el.dispatchEvent(new Event('input')); 
            }
            
            if (data.opciones && Array.isArray(data.opciones)) {
                const optEls = document.querySelectorAll('.opcion-input');
                data.opciones.forEach((opt, idx) => {
                    if (optEls[idx]) optEls[idx].value = opt;
                });
            }
            
            if (data.correcta !== undefined && data.correcta !== null) {
                document.getElementById('respuestaCorrecta').value = data.correcta;
            }

            const container = document.querySelector('.suggest-container');
            if (container) {
                container.style.transition = 'box-shadow 0.5s';
                container.style.boxShadow = '0 0 20px var(--color-primary-500)';
                setTimeout(() => { container.style.boxShadow = 'var(--shadow-md)'; }, 2000);
            }
            
            showMessage('✨ ¡Formulario autocompletado mágicamente por Sabi!', 'success');
        });
    </script>
    <script src="js/sabi_injector.js"></script>
</body>
</html>
