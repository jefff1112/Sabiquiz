<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sabiquiz - Restablecer Contraseña</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 450px;
            width: 100%;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        .container h1 {
            text-align: center;
            color: #2d3748;
            margin-bottom: 5px;
            font-size: 28px;
        }
        .container h1 span {
            color: #667eea;
        }
        .container .subtitle {
            text-align: center;
            color: #718096;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-weight: bold;
            color: #4a5568;
            margin-bottom: 5px;
        }
        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 16px;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }
        .form-group input:focus {
            border-color: #667eea;
            outline: none;
        }
        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }
        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .btn-back {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #667eea;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
        }
        .btn-back:hover {
            text-decoration: underline;
        }
        .message {
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
            font-weight: bold;
            text-align: center;
        }
        .message.success {
            background: #c6f6d5;
            color: #276749;
            display: block;
        }
        .message.error {
            background: #fed7d7;
            color: #c53030;
            display: block;
        }
        .message.info {
            background: #ebf4ff;
            color: #2b6cb0;
            display: block;
        }
        .loading-container {
            text-align: center;
            padding: 30px 0;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #e2e8f0;
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .success-icon {
            font-size: 60px;
            text-align: center;
            display: block;
        }
        .back-to-login {
            text-align: center;
            margin-top: 20px;
            color: #4a5568;
        }
        .back-to-login a {
            color: #667eea;
            text-decoration: none;
            font-weight: bold;
        }
        .back-to-login a:hover {
            text-decoration: underline;
        }
        .token-error {
            text-align: center;
            padding: 30px 0;
        }
        .token-error .icon {
            font-size: 50px;
            display: block;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container" id="appContainer">
        <h1>📚 <span>Sabiquiz</span></h1>
        <p class="subtitle">Restablecer Contraseña</p>

        <div id="messageBox" class="message"></div>

        <!-- ESTADO: VERIFICANDO TOKEN -->
        <div id="loadingState" class="loading-container">
            <div class="spinner"></div>
            <p style="color:#718096; margin-top: 15px;">Verificando enlace...</p>
        </div>

        <!-- ESTADO: TOKEN VÁLIDO - MOSTRAR FORMULARIO -->
        <div id="formState" style="display: none;">
            <form id="resetForm">
                <div class="form-group">
                    <label for="newPassword">🔒 Nueva Contraseña</label>
                    <input type="password" id="newPassword" placeholder="Mínimo 6 caracteres" required>
                </div>
                <div class="form-group">
                    <label for="confirmPassword">🔒 Confirmar Contraseña</label>
                    <input type="password" id="confirmPassword" placeholder="Repite tu contraseña" required>
                </div>

                <button type="submit" class="btn-submit" id="submitBtn">🔐 Restablecer Contraseña</button>
            </form>
        </div>

        <!-- ESTADO: TOKEN INVÁLIDO O EXPIRADO -->
        <div id="errorState" style="display: none;">
            <div class="token-error">
                <span class="icon">❌</span>
                <h3 style="color: #c53030;" id="errorTitle">Enlace inválido o expirado</h3>
                <p style="color: #718096;" id="errorMessage">El enlace de restablecimiento ha expirado o es inválido.</p>
                <a href="forgot-password.html" style="display: inline-block; margin-top: 15px; padding: 12px 30px; background: #667eea; color: white; border-radius: 10px; text-decoration: none; font-weight: bold;">
                    📨 Solicitar nuevo enlace
                </a>
            </div>
        </div>

        <!-- ESTADO: ÉXITO -->
        <div id="successState" style="display: none;">
            <div class="token-error">
                <span class="success-icon">✅</span>
                <h3 style="color: #48bb78;">¡Contraseña actualizada!</h3>
                <p style="color: #718096;">Tu contraseña ha sido restablecida correctamente.</p>
                <a href="login.html" style="display: inline-block; margin-top: 15px; padding: 12px 30px; background: #48bb78; color: white; border-radius: 10px; text-decoration: none; font-weight: bold;">
                    🚀 Ir al inicio de sesión
                </a>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // CONFIGURACIÓN DE LA API
        // ============================================
        const API_URL = 'http://localhost:3000/api';

        // ============================================
        // FUNCIONES DE UI
        // ============================================
        function showMessage(message, type = 'info') {
            const box = document.getElementById('messageBox');
            box.textContent = message;
            box.className = `message ${type}`;
            box.style.display = 'block';
        }

        function hideMessage() {
            const box = document.getElementById('messageBox');
            box.style.display = 'none';
            box.className = 'message';
        }

        function setLoading(loading) {
            const btn = document.getElementById('submitBtn');
            btn.disabled = loading;
            btn.textContent = loading ? '⏳ Actualizando...' : '🔐 Restablecer Contraseña';
        }

        function showState(state) {
            document.getElementById('loadingState').style.display = 'none';
            document.getElementById('formState').style.display = 'none';
            document.getElementById('errorState').style.display = 'none';
            document.getElementById('successState').style.display = 'none';
            
            if (state) {
                document.getElementById(state).style.display = 'block';
            }
        }

        // ============================================
        // OBTENER TOKEN DE LA URL
        // ============================================
        function getTokenFromURL() {
            const params = new URLSearchParams(window.location.search);
            return params.get('token');
        }

        // ============================================
        // VERIFICAR TOKEN
        // ============================================
        async function verifyToken() {
            const token = getTokenFromURL();

            if (!token) {
                showState('errorState');
                document.getElementById('errorTitle').textContent = '❌ Enlace inválido';
                document.getElementById('errorMessage').textContent = 'No se encontró un token de verificación en la URL.';
                return;
            }

            try {
                showState('loadingState');

                const response = await fetch(`${API_URL}/auth/verify-reset-token/${token}`);
                const data = await response.json();

                if (data.success) {
                    // Token válido → mostrar formulario
                    showState('formState');
                    // Guardar token para enviarlo al restablecer
                    window.resetToken = token;
                } else {
                    // Token inválido o expirado
                    showState('errorState');
                    document.getElementById('errorTitle').textContent = '❌ ' + data.error;
                    document.getElementById('errorMessage').textContent = 'El enlace de restablecimiento ha expirado o es inválido. Solicita uno nuevo.';
                }
            } catch (error) {
                console.error('Error verificando token:', error);
                showState('errorState');
                document.getElementById('errorTitle').textContent = '❌ Error de conexión';
                document.getElementById('errorMessage').textContent = 'No se pudo verificar el enlace. Intenta nuevamente.';
            }
        }

        // ============================================
        // RESTABLECER CONTRASEÑA
        // ============================================
        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            hideMessage();

            const password = document.getElementById('newPassword').value.trim();
            const confirmPassword = document.getElementById('confirmPassword').value.trim();

            if (password.length < 6) {
                showMessage('La contraseña debe tener al menos 6 caracteres', 'error');
                return;
            }

            if (password !== confirmPassword) {
                showMessage('Las contraseñas no coinciden', 'error');
                return;
            }

            try {
                setLoading(true);
                showMessage('⏳ Actualizando contraseña...', 'info');

                const response = await fetch(`${API_URL}/auth/reset-password`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        token: window.resetToken,
                        password: password,
                        confirmPassword: confirmPassword
                    })
                });

                const data = await response.json();

                if (data.success) {
                    showState('successState');
                } else {
                    showMessage('❌ ' + data.error, 'error');
                }
            } catch (error) {
                console.error('Error:', error);
                showMessage('❌ Error al conectar con el servidor', 'error');
            } finally {
                setLoading(false);
            }
        });

        // ============================================
        // INICIALIZAR
        // ============================================
        document.addEventListener('DOMContentLoaded', verifyToken);
    </script>
</body>
</html>
