<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sabiquiz - Restablecer Contraseña</title>
    <link rel="stylesheet" href="css/design-system.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-accent-purple) 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: var(--space-4);
            margin: 0;
        }
        .container {
            max-width: 450px;
            width: 100%;
            background: var(--color-surface);
            border-radius: var(--radius-lg);
            padding: var(--space-8);
            box-shadow: var(--shadow-lg);
        }
        .container h1 {
            text-align: center;
            color: var(--color-text);
            margin-bottom: var(--space-2);
            font-size: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .container h1 span {
            color: var(--color-primary);
        }
        .container .subtitle {
            text-align: center;
            color: var(--color-text-muted);
            margin-bottom: var(--space-6);
            font-size: 14px;
        }
        .form-group {
            margin-bottom: var(--space-4);
        }
        .form-group label {
            display: block;
            font-weight: bold;
            color: var(--color-text);
            margin-bottom: 5px;
        }
        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid var(--color-border);
            border-radius: var(--radius-sm);
            font-size: 16px;
            box-sizing: border-box;
            transition: border-color 0.3s;
            background: var(--color-surface);
            color: var(--color-text);
        }
        .form-group input:focus {
            border-color: var(--color-primary);
            outline: none;
        }
        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-accent-purple) 100%);
            color: white;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }
        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .message {
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            margin-bottom: 20px;
            display: none;
            font-weight: bold;
            text-align: center;
        }
        .message.success {
            background: #c6f6d5;
            color: var(--color-success);
            display: block;
        }
        .message.error {
            background: #fed7d7;
            color: var(--color-danger);
            display: block;
        }
        .message.info {
            background: #ebf4ff;
            color: var(--color-primary);
            display: block;
        }
        .loading-container {
            text-align: center;
            padding: 30px 0;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid var(--color-border);
            border-top-color: var(--color-primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .success-icon {
            font-size: 60px;
            text-align: center;
            display: block;
        }
        .token-error {
            text-align: center;
            padding: 30px 0;
        }
        .token-error .icon {
            font-size: 50px;
            display: block;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container card" id="appContainer">
        <h1><img src="img/sabi/sabi_saludando.png" class="sabi-mascot-large sabi-mascot-bounce" style="width: 50px;"> <span>Sabiquiz</span></h1>
        <p class="subtitle">Restablecer Contraseña</p>

        <div id="messageBox" class="message"></div>

        <!-- ESTADO: VERIFICANDO TOKEN -->
        <div id="loadingState" class="loading-container">
            <div class="spinner"></div>
            <p style="color:var(--color-text-muted); margin-top: 15px;">Verificando enlace...</p>
        </div>

        <!-- ESTADO: TOKEN VÁLIDO - MOSTRAR FORMULARIO -->
        <div id="formState" style="display: none;">
            <form id="resetForm">
                <div class="form-group">
                    <label for="newPassword"><img src="img/lock.png" style="width: 16px; vertical-align: middle;"> Nueva Contraseña</label>
                    <input type="password" id="newPassword" class="form-control" placeholder="Mínimo 6 caracteres" required>
                </div>
                <div class="form-group">
                    <label for="confirmPassword"><img src="img/lock.png" style="width: 16px; vertical-align: middle;"> Confirmar Contraseña</label>
                    <input type="password" id="confirmPassword" class="form-control" placeholder="Repite tu contraseña" required>
                </div>

                <button type="submit" class="btn btn-primary" id="submitBtn" style="width: 100%;"><img src="img/cohete.png" style="width: 16px; vertical-align: middle; margin-right: 5px;"> Restablecer Contraseña</button>
            </form>
        </div>

        <!-- ESTADO: TOKEN INVÁLIDO O EXPIRADO -->
        <div id="errorState" style="display: none;">
            <div class="token-error">
                <span class="icon"><img src="img/incorrect.png" style="width: 40px;"></span>
                <h3 style="color: var(--color-danger);" id="errorTitle">Enlace inválido o expirado</h3>
                <p style="color: var(--color-text-muted);" id="errorMessage">El enlace de restablecimiento ha expirado o es inválido.</p>
                <a href="forgot-password.html" class="btn btn-primary" style="display: inline-block; margin-top: 15px; width: 100%; box-sizing: border-box;">
                    📨 Solicitar nuevo enlace
                </a>
            </div>
        </div>

        <!-- ESTADO: ÉXITO -->
        <div id="successState" style="display: none;">
            <div class="token-error">
                <span class="success-icon"><img src="img/sabi/sabi_festejando.png" class="sabi-mascot-large sabi-mascot-bounce" style="width: 80px;"></span>
                <h3 style="color: var(--color-success);">¡Contraseña actualizada!</h3>
                <p style="color: var(--color-text-muted);">Tu contraseña ha sido restablecida correctamente.</p>
                <a href="login.html" class="btn" style="display: inline-block; margin-top: 15px; background: var(--color-success); color: white; width: 100%; box-sizing: border-box;">
                    <img src="img/cohete.png" style="width: 16px; vertical-align: middle;"> Ir al inicio de sesión
                </a>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // CONFIGURACIÓN DE LA API
        // ============================================
        const API_URL = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') ? 'http://localhost:3000/api' : (window.location.origin + '/api');

        // ============================================
        // FUNCIONES DE UI
        // ============================================
        function showMessage(message, type = 'info') {
            const box = document.getElementById('messageBox');
            box.innerHTML = message;
            box.className = `message ${type}`;
            box.style.display = 'block';
        }

        function hideMessage() {
            const box = document.getElementById('messageBox');
            box.style.display = 'none';
            box.className = 'message';
        }

        function setLoading(loading) {
            const btn = document.getElementById('submitBtn');
            btn.disabled = loading;
            if (loading) {
                btn.innerHTML = '<img src="img/estrellas.png" style="width: 16px; vertical-align: middle; margin-right: 5px;"> Actualizando...';
            } else {
                btn.innerHTML = '<img src="img/cohete.png" style="width: 16px; vertical-align: middle; margin-right: 5px;"> Restablecer Contraseña';
            }
        }

        function showState(state) {
            document.getElementById('loadingState').style.display = 'none';
            document.getElementById('formState').style.display = 'none';
            document.getElementById('errorState').style.display = 'none';
            document.getElementById('successState').style.display = 'none';
            
            if (state) {
                document.getElementById(state).style.display = 'block';
            }
        }

        // ============================================
        // OBTENER TOKEN DE LA URL
        // ============================================
        function getTokenFromURL() {
            const params = new URLSearchParams(window.location.search);
            return params.get('token');
        }

        // ============================================
        // VERIFICAR TOKEN
        // ============================================
        async function verifyToken() {
            const token = getTokenFromURL();

            if (!token) {
                showState('errorState');
                document.getElementById('errorTitle').innerHTML = '<img src="img/incorrect.png" style="width: 20px; vertical-align: middle;"> Enlace inválido';
                document.getElementById('errorMessage').textContent = 'No se encontró un token de verificación en la URL.';
                return;
            }

            try {
                showState('loadingState');

                const response = await fetch(`${API_URL}/auth/verify-reset-token/${token}`);
                const data = await response.json();

                if (data.success) {
                    showState('formState');
                    window.resetToken = token;
                } else {
                    showState('errorState');
                    document.getElementById('errorTitle').innerHTML = '<img src="img/incorrect.png" style="width: 20px; vertical-align: middle;"> ' + data.error;
                    document.getElementById('errorMessage').textContent = 'El enlace de restablecimiento ha expirado o es inválido. Solicita uno nuevo.';
                }
            } catch (error) {
                console.error('Error verificando token:', error);
                showState('errorState');
                document.getElementById('errorTitle').innerHTML = '<img src="img/incorrect.png" style="width: 20px; vertical-align: middle;"> Error de conexión';
                document.getElementById('errorMessage').textContent = 'No se pudo verificar el enlace. Intenta nuevamente.';
            }
        }

        // ============================================
        // RESTABLECER CONTRASEÑA
        // ============================================
        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            hideMessage();

            const password = document.getElementById('newPassword').value.trim();
            const confirmPassword = document.getElementById('confirmPassword').value.trim();

            if (password.length < 6) {
                showMessage('La contraseña debe tener al menos 6 caracteres', 'error');
                return;
            }

            if (password !== confirmPassword) {
                showMessage('Las contraseñas no coinciden', 'error');
                return;
            }

            try {
                setLoading(true);
                showMessage('<img src="img/estrellas.png" style="width: 16px; vertical-align: middle;"> Actualizando contraseña...', 'info');

                const response = await fetch(`${API_URL}/auth/reset-password`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        token: window.resetToken,
                        password: password,
                        confirmPassword: confirmPassword
                    })
                });

                const data = await response.json();

                if (data.success) {
                    showState('successState');
                } else {
                    showMessage('<img src="img/incorrect.png" style="width: 16px; vertical-align: middle;"> ' + data.error, 'error');
                }
            } catch (error) {
                console.error('Error:', error);
                showMessage('<img src="img/incorrect.png" style="width: 16px; vertical-align: middle;"> Error al conectar con el servidor', 'error');
            } finally {
                setLoading(false);
            }
        });

        // ============================================
        // INICIALIZAR
        // ============================================
        document.addEventListener('DOMContentLoaded', verifyToken);
    </script>
</body>
</html>
