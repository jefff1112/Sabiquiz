<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sabiquiz - Panel de Administración</title>
    <link rel="stylesheet" href="css/design-system.css">
    <link rel="stylesheet" href="css/navbar.css">
    <style>
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--color-border);
            padding-bottom: var(--space-4);
            margin-bottom: var(--space-6);
            flex-wrap: wrap;
            gap: var(--space-3);
        }
        .admin-header h1 { margin: 0; color: var(--color-text); }
        .admin-header h1 span { color: var(--color-primary); }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: var(--space-4);
            margin-bottom: var(--space-6);
        }
        
        .suggestion-card {
            background: var(--color-surface);
            border-radius: var(--radius-md);
            padding: var(--space-5);
            margin-bottom: var(--space-4);
            border: 1px solid var(--color-border);
            border-left: 4px solid var(--color-accent-amber);
            transition: transform 0.2s;
            box-shadow: var(--shadow-sm);
        }
        .suggestion-card:hover { transform: translateX(5px); }
        .suggestion-card .suggestion-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: var(--space-3);
            margin-bottom: var(--space-3);
        }
        .suggestion-card .suggestion-header .user { font-weight: bold; color: var(--color-text); }
        .suggestion-card .suggestion-header .date { color: var(--color-text-muted); font-size: 0.875rem; }
        .suggestion-card .suggestion-header .materia {
            background: var(--color-primary);
            color: white;
            padding: 2px 12px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: bold;
        }
        .suggestion-card .question-text { font-size: 1.125rem; color: var(--color-text); margin: var(--space-3) 0; }
        .suggestion-card .options-list {
            display: flex;
            gap: var(--space-3);
            flex-wrap: wrap;
            margin: var(--space-3) 0;
        }
        .suggestion-card .options-list .opt {
            background: var(--color-bg);
            padding: 4px 12px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--color-border);
            font-size: 0.875rem;
        }
        .suggestion-card .options-list .opt.correct { border-color: var(--color-success); background: #c6f6d5; }
        .suggestion-card .actions {
            display: flex;
            gap: var(--space-3);
            margin-top: var(--space-4);
            flex-wrap: wrap;
            align-items: center;
        }
        .suggestion-card .actions select {
            padding: 8px 12px;
            border: 2px solid var(--color-border);
            border-radius: var(--radius-sm);
            font-size: 0.875rem;
            background: var(--color-surface);
            color: var(--color-text);
        }
        .suggestion-card .actions select:focus { border-color: var(--color-primary); outline: none; }
        
        .no-suggestions { text-align: center; color: var(--color-text-muted); padding: var(--space-10); font-size: 1.125rem; }
        .loading-text { text-align: center; color: var(--color-text-muted); padding: var(--space-10); }
        
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 15px 25px;
            border-radius: var(--radius-md);
            color: white;
            font-weight: bold;
            z-index: 999;
            animation: slideIn 0.3s ease;
            display: none;
        }
        .toast.success { background: var(--color-success); }
        .toast.error { background: var(--color-danger); }
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        @media (max-width: 600px) {
            .suggestion-card .actions { flex-direction: column; align-items: stretch; }
            .suggestion-card .actions select { width: 100%; }
        }

        .admin-layout {
            display: flex;
            gap: var(--space-6);
        }
        .admin-sidebar {
            width: 220px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: var(--space-2);
        }
        .admin-sidebar .main-tab {
            width: 100%;
            text-align: left;
            padding: var(--space-3) var(--space-4);
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
            color: var(--color-text);
        }
        .admin-sidebar .main-tab.active {
            background: var(--color-primary);
            color: white;
            border-color: var(--color-primary);
        }
        .admin-content {
            flex: 1;
            min-width: 0;
        }
    </style>
</head>
<body>
    <div id="navbar-container"></div>
    <script src="js/layout.js"></script>

    <main class="main-content">
        <div class="breadcrumb">Inicio / Panel Admin</div>

        <div class="card" style="margin-top: var(--space-4);">
            <div class="admin-header">
                <h1>🛡️ Panel de <span>Administración</span></h1>
            </div>

            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-value" id="statPendientes" style="color: var(--color-accent-amber);">0</div>
                    <div class="stat-label">⏳ Pendientes</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="statAprobadas" style="color: var(--color-success);">0</div>
                    <div class="stat-label">✅ Aprobadas</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="statRechazadas" style="color: var(--color-danger);">0</div>
                    <div class="stat-label">❌ Rechazadas</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="statTotal">0</div>
                    <div class="stat-label">📊 Total</div>
                </div>
            </div>

            <div class="admin-layout">
                <aside class="admin-sidebar">
                    <button class="main-tab active" data-tab="suggestions">📝 Sugerencias</button>
                    <button class="main-tab" data-tab="torneos">🏆 Torneos</button>
                </aside>
                
                <div class="admin-content">
                    <!-- SECCIÓN SUGERENCIAS -->
                    <div id="section-suggestions" class="admin-section">
                        <div class="tabs" style="margin-bottom: var(--space-4);">
                            <button class="tab active" data-filter="pendiente">⏳ Pendientes</button>
                            <button class="tab" data-filter="aprobada">✅ Aprobadas</button>
                            <button class="tab" data-filter="rechazada">❌ Rechazadas</button>
                            <button class="tab" data-filter="todas">📋 Todas</button>
                        </div>

                        <div id="suggestionsList">
                            <div class="loading-text">⏳ Cargando sugerencias...</div>
                        </div>
                    </div>

                    <!-- SECCIÓN TORNEOS -->
                    <div id="section-torneos" class="admin-section" style="display: none;">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-4); flex-wrap: wrap; gap: var(--space-3);">
                            <h2 style="margin: 0; color: var(--color-text);">🏆 Gestión de Torneos</h2>
                            <button id="btnNuevoTorneo" class="btn btn-primary">➕ Crear Torneo</button>
                        </div>

                        <div class="tabs" style="margin-bottom: var(--space-4);">
                            <button class="tab active" data-torneo-filter="all">📋 Todos</button>
                            <button class="tab" data-torneo-filter="proximo">📅 Próximos</button>
                            <button class="tab" data-torneo-filter="inscripcion_abierta">✍️ Inscripciones</button>
                            <button class="tab" data-torneo-filter="en_curso">🔴 En Curso</button>
                            <button class="tab" data-torneo-filter="finalizado">🏁 Finalizados</button>
                        </div>

                        <div id="torneosList">
                            <div class="loading-text">⏳ Cargando torneos...</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="toast" class="toast"></div>

    <!-- MODAL CREAR/EDITAR TORNEO -->
    <div id="torneoModal" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); justify-content: center; align-items: center; z-index: 1000;">
        <div class="card" style="width: 90%; max-width: 600px; max-height: 90vh; overflow-y: auto;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-4); border-bottom: 1px solid var(--color-border); padding-bottom: var(--space-3);">
                <h3 id="modalTitle" style="margin: 0; color: var(--color-text);">➕ Crear Torneo</h3>
                <button onclick="closeTorneoModal()" style="background: none; border: none; font-size: 24px; cursor: pointer; color: var(--color-text-muted);">×</button>
            </div>
            <form id="torneoForm">
                <input type="hidden" id="torneoId" name="id">
                
                <div style="margin-bottom: var(--space-4);">
                    <label style="display: block; margin-bottom: 6px; font-weight: 600; color: var(--color-text);">Nombre del Torneo *</label>
                    <input type="text" id="torneoNombre" name="nombre" required placeholder="Ej: 🏆 Torneo de Matemáticas" class="form-control" style="width: 100%; padding: 10px; border: 1px solid var(--color-border); border-radius: var(--radius-sm); background: var(--color-surface); color: var(--color-text);">
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-4); margin-bottom: var(--space-4);">
                    <div>
                        <label style="display: block; margin-bottom: 6px; font-weight: 600; color: var(--color-text);">Materia *</label>
                        <select id="torneoMateria" name="materia_id" required class="form-control" style="width: 100%; padding: 10px; border: 1px solid var(--color-border); border-radius: var(--radius-sm); background: var(--color-surface); color: var(--color-text);">
                            <option value="">Seleccionar materia...</option>
                        </select>
                    </div>
                    <div>
                        <label style="display: block; margin-bottom: 6px; font-weight: 600; color: var(--color-text);">Modo *</label>
                        <select id="torneoModo" name="modo" required class="form-control" style="width: 100%; padding: 10px; border: 1px solid var(--color-border); border-radius: var(--radius-sm); background: var(--color-surface); color: var(--color-text);">
                            <option value="acumulativo">📊 Acumulativo</option>
                            <option value="roundrobin">🔄 Round Robin</option>
                            <option value="ia">🤖 Contra IA</option>
                        </select>
                    </div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-4); margin-bottom: var(--space-4);">
                    <div>
                        <label style="display: block; margin-bottom: 6px; font-weight: 600; color: var(--color-text);">Fecha Inicio *</label>
                        <input type="datetime-local" id="torneoFechaInicio" name="fecha_inicio" required class="form-control" style="width: 100%; padding: 10px; border: 1px solid var(--color-border); border-radius: var(--radius-sm); background: var(--color-surface); color: var(--color-text);">
                    </div>
                    <div>
                        <label style="display: block; margin-bottom: 6px; font-weight: 600; color: var(--color-text);">Fecha Fin *</label>
                        <input type="datetime-local" id="torneoFechaFin" name="fecha_fin" required class="form-control" style="width: 100%; padding: 10px; border: 1px solid var(--color-border); border-radius: var(--radius-sm); background: var(--color-surface); color: var(--color-text);">
                    </div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-4); margin-bottom: var(--space-4);">
                    <div>
                        <label style="display: block; margin-bottom: 6px; font-weight: 600; color: var(--color-text);">Duración (min) *</label>
                        <input type="number" id="torneoDuracion" name="duracion_minutos" value="15" min="5" max="120" required class="form-control" style="width: 100%; padding: 10px; border: 1px solid var(--color-border); border-radius: var(--radius-sm); background: var(--color-surface); color: var(--color-text);">
                    </div>
                    <div>
                        <label style="display: block; margin-bottom: 6px; font-weight: 600; color: var(--color-text);">Máx. Usuarios *</label>
                        <input type="number" id="torneoMaxUsuarios" name="max_usuarios" value="8" min="2" max="100" required class="form-control" style="width: 100%; padding: 10px; border: 1px solid var(--color-border); border-radius: var(--radius-sm); background: var(--color-surface); color: var(--color-text);">
                    </div>
                </div>

                <div style="margin-bottom: var(--space-5);">
                    <label style="display: block; margin-bottom: 6px; font-weight: 600; color: var(--color-text);">Estado</label>
                    <select id="torneoEstado" name="estado" class="form-control" style="width: 100%; padding: 10px; border: 1px solid var(--color-border); border-radius: var(--radius-sm); background: var(--color-surface); color: var(--color-text);">
                        <option value="proximo">📅 Próximo</option>
                        <option value="inscripcion_abierta">✍️ Inscripciones Abiertas</option>
                        <option value="en_curso">🔴 En Curso</option>
                        <option value="finalizado">🏁 Finalizado</option>
                    </select>
                </div>

                <div style="display: flex; gap: var(--space-3); justify-content: flex-end;">
                    <button type="button" class="btn btn-secondary" onclick="closeTorneoModal()">Cancelar</button>
                    <button type="submit" class="btn btn-primary">💾 Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // ============================================
        // CONFIGURACIÓN
        // ============================================
        const API_URL = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') ? 'http://localhost:3000/api' : (window.location.origin + '/api');

        function getToken() {
            return localStorage.getItem('token');
        }

        function checkAuth() {
            const token = getToken();
            if (!token) {
                window.location.href = 'login.html';
                return false;
            }
            return true;
        }

        async function apiRequest(endpoint, options = {}) {
            const token = getToken();
            const headers = {
                'Content-Type': 'application/json',
                'Authorization': token ? `Bearer ${token}` : ''
            };

            const finalOptions = {
                ...options,
                headers: { ...headers, ...options.headers }
            };

            try {
                const response = await fetch(`${API_URL}${endpoint}`, finalOptions);
                const data = await response.json();

                if (!response.ok) {
                    if (response.status === 401) {
                        localStorage.removeItem('token');
                        localStorage.removeItem('user');
                        window.location.href = 'login.html';
                    }
                    throw new Error(data.error || `Error ${response.status}`);
                }
                return data;
            } catch (error) {
                console.error('❌ Error:', error);
                throw error;
            }
        }

        let currentFilter = 'pendiente';
        // 🔥 Flag para evitar múltiples solicitudes
        let isLoading = false;

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `toast ${type}`;
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 3000);
        }

        // ============================================
        // APROBAR SUGERENCIA (CON BLOQUEO)
        // ============================================
        async function approveSuggestion(sugerenciaId, nivelId) {
            if (isLoading) return;
            
            try {
                isLoading = true;
                
                const data = await apiRequest(`/suggestions/aprobar/${sugerenciaId}`, {
                    method: 'POST',
                    body: JSON.stringify({
                        comentario: 'Aprobada por el administrador',
                        nivelId: parseInt(nivelId)
                    })
                });

                if (data.success) {
                    showToast('✅ ¡Pregunta aprobada!', 'success');
                    setTimeout(() => {
                        loadSuggestions(currentFilter);
                    }, 500);
                } else {
                    showToast('❌ Error: ' + data.error, 'error');
                }
            } catch (error) {
                showToast('❌ Error: ' + error.message, 'error');
            } finally {
                isLoading = false;
            }
        }

        // ============================================
        // RECHAZAR SUGERENCIA
        // ============================================
        async function rejectSuggestion(sugerenciaId) {
            if (isLoading) return;
            
            const motivo = prompt('Escribe el motivo del rechazo (opcional):');
            if (motivo === null) return; // Usuario canceló

            try {
                isLoading = true;
                
                const data = await apiRequest(`/suggestions/rechazar/${sugerenciaId}`, {
                    method: 'POST',
                    body: JSON.stringify({
                        comentario: motivo || 'Rechazada por el administrador'
                    })
                });

                if (data.success) {
                    showToast('❌ Pregunta rechazada', 'success');
                    setTimeout(() => {
                        loadSuggestions(currentFilter);
                    }, 500);
                } else {
                    showToast('❌ Error: ' + data.error, 'error');
                }
            } catch (error) {
                showToast('❌ Error: ' + error.message, 'error');
            } finally {
                isLoading = false;
            }
        }

        // ============================================
        // CARGAR SUGERENCIAS (CON LIMPIEZA DE EVENTOS)
        // ============================================
        async function loadSuggestions(filter = 'pendiente') {
            if (isLoading) return;
            
            try {
                if (!checkAuth()) return;

                const list = document.getElementById('suggestionsList');
                list.innerHTML = '<div class="loading-text">⏳ Cargando sugerencias...</div>';

                const data = await apiRequest('/suggestions/pendientes');

                if (!data.success) {
                    throw new Error(data.error || 'Error al cargar sugerencias');
                }

                let sugerencias = data.sugerencias || [];

                if (filter !== 'todas') {
                    sugerencias = sugerencias.filter(s => s.estado === filter);
                }

                // Actualizar estadísticas
                const todas = data.sugerencias || [];
                document.getElementById('statPendientes').textContent = todas.filter(s => s.estado === 'pendiente').length;
                document.getElementById('statAprobadas').textContent = todas.filter(s => s.estado === 'aprobada').length;
                document.getElementById('statRechazadas').textContent = todas.filter(s => s.estado === 'rechazada').length;
                document.getElementById('statTotal').textContent = todas.length;

                if (sugerencias.length === 0) {
                    list.innerHTML = `<div class="no-suggestions">😴 No hay sugerencias ${filter === 'pendiente' ? 'pendientes' : filter === 'aprobada' ? 'aprobadas' : 'rechazadas'}</div>`;
                    return;
                }

                list.innerHTML = '';

                const materiasData = await apiRequest('/quiz/materias');
                const materias = materiasData.materias || [];

                for (const sug of sugerencias) {
                    const card = document.createElement('div');
                    card.className = 'suggestion-card';
                    card.dataset.sugerenciaId = sug.id;

                    if (sug.estado === 'aprobada') {
                        card.style.borderLeftColor = 'var(--color-success)';
                    } else if (sug.estado === 'rechazada') {
                        card.style.borderLeftColor = 'var(--color-danger)';
                    }

                    const opciones = sug.opciones || [];
                    const correcta = sug.respuesta_correcta || 0;

                    let optionsHTML = '';
                    if (opciones.length === 0) {
                        optionsHTML = '<span style="color:var(--color-text-muted);">Sin opciones</span>';
                    } else {
                        opciones.forEach((opt, index) => {
                            const isCorrect = index === correcta;
                            optionsHTML += `<span class="opt ${isCorrect ? 'correct' : ''}">${opt}</span>`;
                        });
                    }

                    let nivelSelectHTML = '';
                    if (sug.estado === 'pendiente') {
                        const materia = materias.find(m => m.id === sug.materia_id);
                        let nivelesHTML = '<option value="">Seleccionar nivel...</option>';
                        if (materia) {
                            try {
                                const nivelesData = await apiRequest(`/quiz/materia/${materia.id}/niveles`);
                                if (nivelesData.success && nivelesData.niveles) {
                                    nivelesData.niveles.forEach(n => {
                                        nivelesHTML += `<option value="${n.id}">Nivel ${n.numero}</option>`;
                                    });
                                }
                            } catch (e) {
                                console.log('Error cargando niveles:', e);
                            }
                        }
                        nivelSelectHTML = `
                            <select class="nivel-select" data-sugerencia="${sug.id}">
                                ${nivelesHTML}
                            </select>
                        `;
                    }

                    card.innerHTML = `
                        <div class="suggestion-header">
                            <span class="user">👤 ${sug.username || 'Usuario'}</span>
                            <span class="badge" style="background-color: var(--color-primary); color: white;">${sug.materia_nombre || 'Sin materia'}</span>
                            <span class="date">${new Date(sug.fecha_sugerencia).toLocaleDateString()}</span>
                            <span class="badge" style="background-color: ${sug.estado === 'pendiente' ? 'var(--color-accent-amber)' : sug.estado === 'aprobada' ? 'var(--color-success)' : 'var(--color-danger)'};">
                                ${sug.estado === 'pendiente' ? '⏳ Pendiente' : sug.estado === 'aprobada' ? '✅ Aprobada' : '❌ Rechazada'}
                            </span>
                        </div>
                        <div class="question-text">🤔 ${sug.texto_es || 'Pregunta'}</div>
                        <div class="options-list">${optionsHTML}</div>
                        ${sug.estado === 'pendiente' ? `
                            <div class="actions">
                                ${nivelSelectHTML}
                                <button class="btn btn-secondary btn-verify-ai" data-sugerencia="${sug.id}">🤖 Evaluar con Sabi</button>
                                <button class="btn btn-primary btn-approve" data-sugerencia="${sug.id}">✅ Aprobar</button>
                                <button class="btn btn-danger btn-reject" data-sugerencia="${sug.id}">❌ Rechazar</button>
                            </div>
                        ` : `
                            <div style="margin-top:10px;font-size:14px;color:var(--color-text-muted);">
                                ${sug.comentario_moderador ? '💬 Comentario: ' + sug.comentario_moderador : ''}
                                ${sug.fecha_revision ? '📅 Revisado: ' + new Date(sug.fecha_revision).toLocaleDateString() : ''}
                            </div>
                        `}
                    `;

                    list.appendChild(card);
                }

            } catch (error) {
                console.error('Error:', error);
                document.getElementById('suggestionsList').innerHTML = `
                    <div class="no-suggestions">❌ Error: ${error.message}</div>
                `;
            }
        }

        // Listener global para sugerencias
        document.getElementById('suggestionsList').addEventListener('click', function(event) {
            const target = event.target;
            
            if (target.classList.contains('btn-verify-ai')) {
                const sugerenciaId = target.dataset.sugerencia;
                const card = target.closest('.suggestion-card');
                const textQ = card.querySelector('.question-text') ? card.querySelector('.question-text').textContent.replace('🤔', '').trim() : '';
                
                let opcionesText = [];
                let correctaIdx = 0;
                const opEls = card.querySelectorAll('.options-list .opt');
                opEls.forEach((el, idx) => {
                    opcionesText.push(el.textContent.trim());
                    if (el.classList.contains('correct')) correctaIdx = idx;
                });

                target.disabled = true;
                target.innerHTML = '🤖 Pensando...';

                apiRequest('/sabi/verify-suggestion', {
                    method: 'POST',
                    body: JSON.stringify({
                        pregunta: textQ,
                        opciones: opcionesText,
                        correcta: correctaIdx
                    })
                }).then(data => {
                    target.disabled = false;
                    target.innerHTML = '🤖 Evaluar con Sabi';
                    if (data.success) {
                        alert('🤖 Sabi dice:\n' + data.analisis);
                    } else {
                        alert('Error de Sabi:\n' + data.error);
                    }
                }).catch(error => {
                    target.disabled = false;
                    target.innerHTML = '🤖 Evaluar con Sabi';
                    alert('Error de conexión. ¿Reiniciaste el backend?');
                });
            }
            
            if (target.classList.contains('btn-approve')) {
                const sugerenciaId = target.dataset.sugerencia;
                const card = target.closest('.suggestion-card');
                const select = card ? card.querySelector('.nivel-select') : null;
                const nivelId = select ? select.value : null;

                if (!nivelId) {
                    showToast('🤔 Por favor, selecciona un nivel para la pregunta', 'error');
                    return;
                }

                target.disabled = true;
                target.innerHTML = '⏳ Procesando...';
                
                approveSuggestion(sugerenciaId, nivelId).finally(() => {
                    target.disabled = false;
                    target.innerHTML = '✅ Aprobar';
                });
            }
            
            if (target.classList.contains('btn-reject')) {
                const sugerenciaId = target.dataset.sugerencia;
                
                target.disabled = true;
                target.innerHTML = '⏳ Procesando...';
                
                rejectSuggestion(sugerenciaId).finally(() => {
                    target.disabled = false;
                    target.innerHTML = '❌ Rechazar';
                });
            }
        });

        // ============================================
        // FILTROS
        // ============================================
        document.querySelectorAll('.tab[data-filter]').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab[data-filter]').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                loadSuggestions(currentFilter);
            });
        });

        // ============================================
        // INICIALIZAR
        // ============================================
        document.addEventListener('DOMContentLoaded', () => {
            if (!checkAuth()) return;
            loadSuggestions('pendiente');
            loadMateriasForTorneo();
            loadTorneos('all');
            
            // Tabs principales
            const mainTabs = document.querySelectorAll('.main-tab');
            if (mainTabs.length > 0) {
                mainTabs.forEach(btn => {
                    btn.addEventListener('click', () => {
                        document.querySelectorAll('.main-tab').forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        document.querySelectorAll('.admin-section').forEach(s => s.style.display = 'none');
                        const section = document.getElementById('section-' + btn.dataset.tab);
                        if (section) section.style.display = 'block';
                    });
                });
            }
            
            // Filtros de torneos
            const torneoFilters = document.querySelectorAll('.tab[data-torneo-filter]');
            if (torneoFilters.length > 0) {
                torneoFilters.forEach(btn => {
                    btn.addEventListener('click', () => {
                        document.querySelectorAll('.tab[data-torneo-filter]').forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        loadTorneos(btn.dataset.torneoFilter);
                    });
                });
            }

            // Modal torneo
            const btnNuevo = document.getElementById('btnNuevoTorneo');
            if (btnNuevo) btnNuevo.addEventListener('click', () => openTorneoModal());
            
            const torneoForm = document.getElementById('torneoForm');
            if (torneoForm) torneoForm.addEventListener('submit', saveTorneo);
        });

        // ============================================
        // GESTIÓN DE TORNEOS
        // ============================================
        let currentTorneoFilter = 'all';

        async function loadMateriasForTorneo() {
            try {
                const data = await apiRequest('/quiz/materias');
                const select = document.getElementById('torneoMateria');
                if (!select) return;
                
                if (data.success && data.materias) {
                    select.innerHTML = '<option value="">Seleccionar materia...</option>';
                    data.materias.forEach(m => {
                        const opt = document.createElement('option');
                        opt.value = m.id;
                        opt.textContent = m.nombre;
                        select.appendChild(opt);
                    });
                }
            } catch (e) { console.log('Error cargando materias:', e); }
        }

        async function loadTorneos(filter = 'all') {
            currentTorneoFilter = filter;
            const list = document.getElementById('torneosList');
            list.innerHTML = '<div class="loading-text">⏳ Cargando torneos...</div>';
            
            try {
                const data = await apiRequest('/torneos');
                if (!data.success) throw new Error(data.error);

                let torneos = data.torneos || [];
                if (filter !== 'all') {
                    torneos = torneos.filter(t => t.estado === filter);
                }

                if (torneos.length === 0) {
                    list.innerHTML = '<div class="no-suggestions">😴 No hay torneos</div>';
                    return;
                }

                list.innerHTML = '';
                torneos.forEach(t => {
                    const card = document.createElement('div');
                    card.className = 'suggestion-card';
                    card.style.borderLeftColor = getEstadoColor(t.estado);
                    
                    const inscritos = t.inscritos || 0;
                    
                    card.innerHTML = `
                        <div class="suggestion-header">
                            <span class="user">🏆 ${t.nombre}</span>
                            <span class="badge" style="background-color: var(--color-primary); color: white;">${t.materia_nombre}</span>
                            <span class="date">${formatDate(t.fecha_inicio)}</span>
                            <span class="badge" style="background-color: ${getEstadoColor(t.estado)};">
                                ${getEstadoText(t.estado)}
                            </span>
                        </div>
                        <div class="question-text" style="font-size: 0.9rem;">
                            📅 Inicio: ${formatDate(t.fecha_inicio)} | ⏰ Fin: ${formatDate(t.fecha_fin)}<br>
                            👥 ${inscritos}/${t.max_usuarios} | ⏱️ ${t.duracion_minutos}min | 🎮 ${t.modo}
                        </div>
                        <div class="actions">
                            <button class="btn btn-secondary" onclick="editTorneo(${t.id})">✏️ Editar</button>
                            <button class="btn btn-danger" onclick="deleteTorneo(${t.id})">🗑️ Eliminar</button>
                            <a href="torneo_detalle.html?id=${t.id}" class="btn btn-primary" target="_blank" style="text-decoration:none;">👁️ Ver</a>
                        </div>
                    `;
                    list.appendChild(card);
                });
            } catch (error) {
                console.error('Error:', error);
                list.innerHTML = `<div class="no-suggestions">❌ Error: ${error.message}</div>`;
            }
        }

        function getEstadoColor(estado) {
            const colors = {
                'proximo': 'var(--color-primary)',
                'inscripcion_abierta': 'var(--color-accent-amber)',
                'en_curso': 'var(--color-success)',
                'finalizado': 'var(--color-text-muted)'
            };
            return colors[estado] || 'var(--color-text-muted)';
        }

        function getEstadoText(estado) {
            const texts = {
                'proximo': '📅 Próximo',
                'inscripcion_abierta': '✍️ Inscripciones',
                'en_curso': '🔴 En Curso',
                'finalizado': '🏁 Finalizado'
            };
            return texts[estado] || estado;
        }

        function formatDate(dateStr) {
            const date = new Date(dateStr);
            return date.toLocaleDateString('es-ES', { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
        }

        function openTorneoModal(torneo = null) {
            const modal = document.getElementById('torneoModal');
            const form = document.getElementById('torneoForm');
            const title = document.getElementById('modalTitle');
            
            if (!form || !modal || !title) return;
            
            form.reset();
            const torneoIdEl = document.getElementById('torneoId');
            if (torneoIdEl) torneoIdEl.value = '';
            
            if (torneo) {
                title.textContent = '✏️ Editar Torneo';
                if (document.getElementById('torneoId')) document.getElementById('torneoId').value = torneo.id;
                if (document.getElementById('torneoNombre')) document.getElementById('torneoNombre').value = torneo.nombre;
                if (document.getElementById('torneoMateria')) document.getElementById('torneoMateria').value = torneo.materia_id;
                if (document.getElementById('torneoModo')) document.getElementById('torneoModo').value = torneo.modo;
                if (document.getElementById('torneoFechaInicio')) document.getElementById('torneoFechaInicio').value = formatDateForInput(torneo.fecha_inicio);
                if (document.getElementById('torneoFechaFin')) document.getElementById('torneoFechaFin').value = formatDateForInput(torneo.fecha_fin);
                if (document.getElementById('torneoDuracion')) document.getElementById('torneoDuracion').value = torneo.duracion_minutos;
                if (document.getElementById('torneoMaxUsuarios')) document.getElementById('torneoMaxUsuarios').value = torneo.max_usuarios;
                if (document.getElementById('torneoEstado')) document.getElementById('torneoEstado').value = torneo.estado;
            } else {
                title.textContent = '➕ Crear Torneo';
                const tomorrow = new Date();
                tomorrow.setDate(tomorrow.getDate() + 1);
                tomorrow.setHours(10, 0, 0, 0);
                if (document.getElementById('torneoFechaInicio')) document.getElementById('torneoFechaInicio').value = formatDateForInput(tomorrow.toISOString());
                const end = new Date(tomorrow);
                end.setMinutes(end.getMinutes() + 15);
                if (document.getElementById('torneoFechaFin')) document.getElementById('torneoFechaFin').value = formatDateForInput(end.toISOString());
            }
            
            modal.style.display = 'flex';
        }

        function formatDateForInput(dateStr) {
            const date = new Date(dateStr);
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            const hours = String(date.getHours()).padStart(2, '0');
            const minutes = String(date.getMinutes()).padStart(2, '0');
            return `${year}-${month}-${day}T${hours}:${minutes}`;
        }

        function closeTorneoModal() {
            document.getElementById('torneoModal').style.display = 'none';
        }

        async function editTorneo(id) {
            try {
                const data = await apiRequest('/torneos/' + id);
                if (data.success) {
                    openTorneoModal(data.torneo);
                } else {
                    showToast('❌ ' + data.error, 'error');
                }
            } catch (error) {
                showToast('❌ Error: ' + error.message, 'error');
            }
        }

        async function deleteTorneo(id) {
            if (!confirm('¿Seguro que quieres ELIMINAR este torneo? Esta acción no se puede deshacer.')) return;
            try {
                const data = await apiRequest('/torneos/' + id, { method: 'DELETE' });
                if (data.success) {
                    showToast('✅ Torneo eliminado', 'success');
                    loadTorneos(currentTorneoFilter);
                } else {
                    showToast('❌ ' + data.error, 'error');
                }
            } catch (error) {
                showToast('❌ Error: ' + error.message, 'error');
            }
        }

        async function saveTorneo(e) {
            e.preventDefault();
            const form = e.target;
            if (!form) return;
            
            const formData = new FormData(form);
            const torneoData = Object.fromEntries(formData);
            
            if (torneoData.materia_id) torneoData.materia_id = parseInt(torneoData.materia_id);
            if (torneoData.duracion_minutos) torneoData.duracion_minutos = parseInt(torneoData.duracion_minutos);
            if (torneoData.max_usuarios) torneoData.max_usuarios = parseInt(torneoData.max_usuarios);
            
            // Convertir fechas locales a UTC antes de enviar al servidor (que está en UTC)
            if (torneoData.fecha_inicio) torneoData.fecha_inicio = new Date(torneoData.fecha_inicio).toISOString();
            if (torneoData.fecha_fin) torneoData.fecha_fin = new Date(torneoData.fecha_fin).toISOString();
            
            const id = torneoData.id;
            delete torneoData.id;
            
            try {
                const url = id ? '/torneos/' + id : '/torneos';
                const method = id ? 'PUT' : 'POST';
                const data = await apiRequest(url, {
                    method: method,
                    body: JSON.stringify(torneoData)
                });
                
                if (data.success) {
                    showToast(id ? '✅ Torneo actualizado' : '✅ Torneo creado', 'success');
                    closeTorneoModal();
                    loadTorneos(currentTorneoFilter);
                } else {
                    showToast('❌ ' + data.error, 'error');
                }
            } catch (error) {
                showToast('❌ Error: ' + error.message, 'error');
            }
        }
    </script>
</body>
</html>
