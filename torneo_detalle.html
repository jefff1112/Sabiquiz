<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle del Torneo - Sabiquiz</title>
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #667eea, #764ba2);
            --accent-green: #48bb78;
            --accent-purple: #9f7aea;
            --text-dark: #2d3748;
            --text-muted: #718096;
            --bg-card: #ffffff;
            --border-light: #e2e8f0;
            --radius-lg: 24px;
            --radius-md: 16px;
            --radius-sm: 12px;
            --shadow-card: 0 24px 60px rgba(56, 66, 120, 0.22);
            --shadow-soft: 0 8px 25px rgba(0, 0, 0, 0.08);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px 16px;
            font-family: 'DM Sans', 'Segoe UI', system-ui, sans-serif;
            background: radial-gradient(circle at 20% 10%, #eef2ff, #e0e7ff 45%, #dbeafe 100%);
            color: var(--text-dark);
        }

        .container {
            width: 100%;
            max-width: 900px;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 16px;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #667eea;
            text-decoration: none;
            font-weight: 700;
            font-size: 15px;
            padding: 10px 18px;
            border-radius: var(--radius-sm);
            background: #f1f5f9;
            border: 1px solid var(--border-light);
            transition: all 0.2s ease;
        }

        .back-btn:hover {
            background: #e2e8f0;
            transform: translateX(-3px);
            color: #4c51bf;
        }

        .tournament-header {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            padding: 28px;
            box-shadow: var(--shadow-card);
            border: 1px solid rgba(255, 255, 255, 0.8);
            margin-bottom: 24px;
            position: relative;
            overflow: hidden;
        }

        .tournament-header::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 4px;
            background: var(--primary-gradient);
        }

        .tournament-title-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 20px;
        }

        .tournament-name {
            font-family: 'Quicksand', sans-serif;
            font-size: 24px;
            font-weight: 700;
            color: var(--text-dark);
        }

        .tournament-status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 18px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 700;
            font-family: 'Quicksand', sans-serif;
        }

        .status-proximo { background: #eef2ff; color: #667eea; }
        .status-inscripcion_abierta { background: #fef3c7; color: #d97706; }
        .status-en_curso { background: #dcfce7; color: #16a34a; animation: pulse 2s infinite; }
        .status-finalizado { background: #f1f5f9; color: #64748b; }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .tournament-meta-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid var(--border-light);
        }

        .meta-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .meta-label {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 600;
        }

        .meta-value {
            font-family: 'Quicksand', sans-serif;
            font-size: 18px;
            font-weight: 700;
            color: var(--text-dark);
        }

        .countdown-large {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: linear-gradient(135deg, #fef3c7, #fde68a);
            color: #92400e;
            padding: 12px 24px;
            border-radius: var(--radius-md);
            font-family: 'Quicksand', sans-serif;
            font-weight: 700;
            font-size: 16px;
            margin-top: 16px;
        }

        .countdown-large.urgent {
            background: linear-gradient(135deg, #fee2e2, #fecaca);
            color: #dc2626;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        .section-card {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            padding: 24px;
            box-shadow: var(--shadow-card);
            border: 1px solid rgba(255, 255, 255, 0.8);
            margin-bottom: 24px;
        }

        .section-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: 'Quicksand', sans-serif;
            font-size: 20px;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-light);
        }

        .section-title img { width: 28px; height: 28px; }

        /* Ranking Table */
        .ranking-table {
            width: 100%;
            border-collapse: collapse;
        }

        .ranking-table th,
        .ranking-table td {
            padding: 14px 16px;
            text-align: left;
            border-bottom: 1px solid var(--border-light);
        }

        .ranking-table th {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            font-weight: 600;
        }

        .ranking-table tbody tr:last-child td { border-bottom: none; }
        .ranking-table tbody tr:hover { background: #f8fafc; }

        .rank-cell {
            font-family: 'Quicksand', sans-serif;
            font-weight: 700;
            font-size: 18px;
        }

        .rank-1 { color: #f6ad55; }
        .rank-2 { color: #a0aec0; }
        .rank-3 { color: #c05621; }
        .rank-other { color: var(--text-muted); }

        .player-cell {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .player-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--border-light);
        }

        .player-name {
            font-weight: 600;
            color: var(--text-dark);
        }

        .player-name.you {
            color: #667eea;
        }

        .score-cell {
            font-family: 'Quicksand', sans-serif;
            font-weight: 700;
            font-size: 16px;
            color: var(--text-dark);
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 700;
        }

        .badge-gold { background: #fef3c7; color: #92400e; }
        .badge-silver { background: #f1f5f9; color: #64748b; }
        .badge-bronze { background: #fef3f2; color: #c05621; }
        .badge-participant { background: #eef2ff; color: #667eea; }

        .empty-ranking {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
        }

        .empty-ranking img { width: 80px; margin-bottom: 16px; opacity: 0.5; }

        /* Partidas jugadas */
        .matches-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 12px;
        }

        .match-card {
            background: #f8fafc;
            border-radius: var(--radius-md);
            padding: 16px;
            text-align: center;
            border: 2px solid var(--border-light);
            transition: all 0.2s;
        }

        .match-card:hover {
            border-color: #667eea;
            transform: translateY(-2px);
        }

        .match-card.played {
            border-color: #48bb78;
            background: #f0fff4;
        }

        .match-number {
            font-family: 'Quicksand', sans-serif;
            font-size: 14px;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .match-score {
            font-family: 'Quicksand', sans-serif;
            font-size: 28px;
            font-weight: 700;
            color: var(--text-dark);
        }

        .match-score.played { color: #48bb78; }

        .match-status {
            font-size: 12px;
            margin-top: 4px;
        }

        .status-pending { color: var(--text-muted); }
        .status-played { color: #48bb78; font-weight: 600; }

        .btn-play-match {
            width: 100%;
            margin-top: 12px;
            padding: 12px;
            background: var(--primary-gradient);
            color: white;
            border: none;
            border-radius: var(--radius-sm);
            font-family: 'Quicksand', sans-serif;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-play-match:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-play-match:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Mis Stats */
        .my-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }

        .stat-box {
            background: #f8fafc;
            border-radius: var(--radius-md);
            padding: 20px;
            text-align: center;
            border: 1px solid var(--border-light);
        }

        .stat-box.highlight {
            background: linear-gradient(135deg, #eef2ff, #faf5ff);
            border-color: #667eea;
        }

        .stat-value {
            font-family: 'Quicksand', sans-serif;
            font-size: 32px;
            font-weight: 700;
            color: var(--text-dark);
        }

        .stat-box.highlight .stat-value { color: #667eea; }

        .stat-label {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal {
            background: white;
            border-radius: var(--radius-lg);
            padding: 32px;
            max-width: 400px;
            width: 90%;
            text-align: center;
            transform: scale(0.9);
            transition: transform 0.3s ease;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.2);
        }

        .modal-overlay.active .modal {
            transform: scale(1);
        }

        .modal img { width: 80px; margin-bottom: 16px; }
        .modal h3 { font-family: 'Quicksand', sans-serif; font-size: 22px; margin-bottom: 12px; }
        .modal p { color: var(--text-muted); margin-bottom: 24px; }

        .modal-buttons {
            display: flex;
            gap: 12px;
        }

        .modal-btn {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: var(--radius-md);
            font-family: 'Quicksand', sans-serif;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }

        .modal-btn-primary {
            background: var(--primary-gradient);
            color: white;
        }

        .modal-btn-secondary {
            background: #f1f5f9;
            color: var(--text-dark);
        }

        @media (max-width: 640px) {
            .tournament-meta-grid { grid-template-columns: 1fr 1fr; }
            .my-stats { grid-template-columns: 1fr; }
            .ranking-table th:nth-child(4), .ranking-table td:nth-child(4) { display: none; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="page-header">
            <a href="torneos.html" class="back-btn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                Volver a Torneos
            </a>
        </div>

        <div id="tournamentHeader"></div>

        <!-- Mis Stats (si está inscrito) -->
        <div id="myStatsSection" class="section-card" style="display:none;">
            <div class="section-title"><img src="img/estrellas.png" class="icon-btn"> Tu Progreso</div>
            <div class="my-stats">
                <div class="stat-box" id="statPuntaje">
                    <div class="stat-value">0</div>
                    <div class="stat-label">Puntaje Total</div>
                </div>
                <div class="stat-box highlight" id="statPosicion">
                    <div class="stat-value">--</div>
                    <div class="stat-label">Posición Actual</div>
                </div>
                <div class="stat-box" id="statPartidas">
                    <div class="stat-value">0/5</div>
                    <div class="stat-label">Partidas Jugadas</div>
                </div>
            </div>

            <div class="section-title" style="margin-top:0;"><img src="img/cohete.png" class="icon-btn"> Partidas del Torneo</div>
            <div class="matches-grid" id="matchesGrid"></div>
        </div>

        <!-- Ranking -->
        <div class="section-card">
            <div class="section-title"><img src="img/trofeo.png" class="icon-btn"> Ranking <span id="rankingBadge" style="font-size:14px;font-weight:500;color:var(--text-muted);margin-left:auto;"></span></div>
            <div id="rankingContainer">
                <div class="empty-ranking"><div class="spinner" style="margin:0 auto 16px;width:40px;height:40px;border:4px solid #e2e8f0;border-top-color:#667eea;border-radius:50%;animation:spin 0.8s linear infinite;"></div>Cargando ranking...</div>
            </div>
        </div>
    </div>

    <!-- Modal Jugar Partida -->
    <div id="playModal" class="modal-overlay">
        <div class="modal">
            <img src="img/sabi/sabi_competitivo.png" alt="Sabi">
            <h3>Jugar Partida <span id="modalMatchNum"></span></h3>
            <p>¿Listo para competir? Esta partida cuenta para tu puntaje del torneo.</p>
            <div class="modal-buttons">
                <button class="modal-btn modal-btn-secondary" onclick="closePlayModal()">Cancelar</button>
                <button class="modal-btn modal-btn-primary" onclick="confirmPlayMatch()">¡Jugar Ahora!</button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') 
            ? 'http://localhost:3000/api' 
            : (window.location.origin + '/api');

        function getToken() { return localStorage.getItem('token'); }

        async function apiRequest(endpoint, options = {}) {
            const token = getToken();
            const headers = { 
                'Content-Type': 'application/json', 
                'Authorization': token ? 'Bearer ' + token : '' 
            };
            const finalOptions = { ...options, headers: { ...headers, ...options.headers } };
            const response = await fetch(API_URL + endpoint, finalOptions);
            if (!response.ok) {
                if (response.status === 401) { 
                    localStorage.removeItem('token'); window.location.href = 'login.html'; 
                }
                throw new Error(await response.text());
            }
            return await response.json();
        }

        function checkAuth() { 
            if (!getToken()) { window.location.href = 'login.html'; return false; } 
            return true; 
        }

        function getTorneoId() {
            const params = new URLSearchParams(window.location.search);
            return params.get('id');
        }

        function formatDate(dateStr) {
            const date = new Date(dateStr);
            return date.toLocaleDateString('es-ES', { 
                weekday: 'long', day: 'numeric', month: 'long', 
                hour: '2-digit', minute: '2-digit' 
            });
        }

        function getTimeUntil(dateStr) {
            const now = new Date();
            const target = new Date(dateStr);
            const diff = target - now;
            
            if (diff <= 0) return { text: '¡YA EMPEZÓ!', urgent: true };
            
            const hours = Math.floor(diff / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);
            
            if (hours > 0) return { text: `${hours}h ${minutes}m ${seconds}s`, urgent: hours < 1 };
            if (minutes > 0) return { text: `${minutes}m ${seconds}s`, urgent: minutes <= 5 };
            return { text: `${seconds}s`, urgent: true };
        }

        function getRankBadge(posicion) {
            if (posicion === 1) return '<span class="badge badge-gold">🥇 Oro</span>';
            if (posicion === 2) return '<span class="badge badge-silver">🥈 Plata</span>';
            if (posicion === 3) return '<span class="badge badge-bronze">🥉 Bronce</span>';
            return '<span class="badge badge-participant">Participante</span>';
        }

        function renderTournamentHeader(torneo) {
            const timeInfo = getTimeUntil(torneo.fecha_inicio);
            const container = document.getElementById('tournamentHeader');
            
            let statusClass = 'status-' + torneo.estado;
            let statusText = {
                'proximo': 'Próximo',
                'inscripcion_abierta': 'Inscripciones Abiertas',
                'en_curso': '🔴 EN CURSO',
                'finalizado': 'Finalizado'
            }[torneo.estado] || torneo.estado;

            let countdownHTML = '';
            if (torneo.estado === 'inscripcion_abierta') {
                countdownHTML = `<div class="countdown-large ${timeInfo.urgent ? 'urgent' : ''}" id="countdownTimer">⏰ Inicia en: ${timeInfo.text}</div>`;
            } else if (torneo.estado === 'en_curso') {
                countdownHTML = `<div class="countdown-large urgent" id="countdownTimer">⏳ Termina en: ${timeInfo.text}</div>`;
            } else if (torneo.estado === 'proximo') {
                countdownHTML = `<div class="countdown-large">📅 Comienza: ${formatDate(torneo.fecha_inicio)}</div>`;
            }

            container.innerHTML = `
                <div class="tournament-header">
                    <div class="tournament-title-row">
                        <h2 class="tournament-name">${torneo.nombre}</h2>
                        <span class="tournament-status ${statusClass}">${statusText}</span>
                    </div>
                    <div class="tournament-meta-grid">
                        <div class="meta-item">
                            <span class="meta-label">Materia</span>
                            <span class="meta-value"><img src="${torneo.materia_icono || 'img/mat.png'}" style="width:20px;height:20px;vertical-align:middle;margin-right:6px;"> ${torneo.materia_nombre}</span>
                        </div>
                        <div class="meta-item">
                            <span class="meta-label">Duración</span>
                            <span class="meta-value">${torneo.duracion_minutos} min (5 partidas)</span>
                        </div>
                        <div class="meta-item">
                            <span class="meta-label">Participantes</span>
                            <span class="meta-value">${torneo.inscritos}/${torneo.max_usuarios}</span>
                        </div>
                        <div class="meta-item">
                            <span class="meta-label">Modo</span>
                            <span class="meta-value">${torneo.modo === 'acumulativo' ? 'Acumulativo' : torneo.modo}</span>
                        </div>
                    </div>
                    ${countdownHTML}
                </div>
            `;
        }

        function renderRanking(ranking, provisional, miInscripcion) {
            const container = document.getElementById('rankingContainer');
            const badge = document.getElementById('rankingBadge');
            
            badge.textContent = provisional ? ' (Provisional)' : '';

            if (!ranking || ranking.length === 0) {
                container.innerHTML = '<div class="empty-ranking"><img src="img/trofeo.png" class="icon-btn"><h3>Sin ranking aún</h3><p>El ranking aparecerá cuando termine el torneo</p></div>';
                return;
            }

            let html = `
                <div style="overflow-x:auto;">
                    <table class="ranking-table">
                        <thead>
                            <tr>
                                <th style="width:60px;">Pos</th>
                                <th>Jugador</th>
                                <th style="width:100px;">Puntaje</th>
                                <th style="width:100px;">Insignia</th>
                            </tr>
                        </thead>
                        <tbody>
            `;

            ranking.forEach(r => {
                const isMe = r.soy_yo;
                const rankClass = r.posicion === 1 ? 'rank-1' : r.posicion === 2 ? 'rank-2' : r.posicion === 3 ? 'rank-3' : 'rank-other';
                
                html += `
                    <tr${isMe ? ' style="background:linear-gradient(135deg,#eef2ff 0%,#faf5ff 100%);"' : ''}>
                        <td class="rank-cell ${rankClass}">${r.posicion}</td>
                        <td class="player-cell">
                            <img src="${r.avatar_url || 'img/default-avatar.png'}" class="player-avatar" alt="${r.username}">
                            <span class="player-name${isMe ? ' you' : ''}">${r.username}${isMe ? ' (Tú)' : ''}</span>
                        </td>
                        <td class="score-cell">${r.puntaje_final}</td>
                        <td>${getRankBadge(r.posicion)}</td>
                    </tr>
                `;
            });

            html += '</tbody></table></div>';
            container.innerHTML = html;
        }

        function renderMyStats(torneo, miInscripcion) {
            if (!miInscripcion) return;

            document.getElementById('myStatsSection').style.display = 'block';
            
            document.getElementById('statPuntaje').querySelector('.stat-value').textContent = miInscripcion.puntaje;
            document.getElementById('statPartidas').querySelector('.stat-value').textContent = `${miInscripcion.partidas_jugadas}/5`;

            // Cargar ranking para encontrar mi posición
            apiRequest('/torneos/' + torneo.id + '/ranking')
                .then(data => {
                    if (data.success && data.ranking) {
                        const miRank = data.ranking.find(r => r.soy_yo);
                        if (miRank) {
                            document.getElementById('statPosicion').querySelector('.stat-value').textContent = '#' + miRank.posicion;
                        }
                    }
                });

            // Renderizar partidas
            const grid = document.getElementById('matchesGrid');
            let html = '';
            for (let i = 1; i <= 5; i++) {
                const played = i <= miInscripcion.partidas_jugadas;
                html += `
                    <div class="match-card${played ? ' played' : ''}">
                        <div class="match-number">Partida ${i}</div>
                        <div class="match-score${played ? ' played' : ''}">${played ? '+' + Math.floor(miInscripcion.puntaje / Math.max(1, miInscripcion.partidas_jugadas)) : '---'}</div>
                        <div class="match-status${played ? ' status-played' : ' status-pending'}">${played ? '✅ Jugada' : '⏳ Pendiente'}</div>
                        ${!played && torneo.estado === 'en_curso' && miInscripcion.partidas_jugadas === i - 1 ? 
                            `<button class="btn-play-match" onclick="openPlayModal(${i})">🎮 Jugar</button>` : 
                            (played || torneo.estado !== 'en_curso' ? '' : '<button class="btn-play-match" disabled>Esperar turno</button>')
                        }
                    </div>
                `;
            }
            grid.innerHTML = html;
        }

        let currentMatchToPlay = 0;

        function openPlayModal(matchNum) {
            currentMatchToPlay = matchNum;
            document.getElementById('modalMatchNum').textContent = matchNum;
            document.getElementById('playModal').classList.add('active');
        }

        function closePlayModal() {
            document.getElementById('playModal').classList.remove('active');
            currentMatchToPlay = 0;
        }

        async function confirmPlayMatch() {
            const torneoId = getTorneoId();
            closePlayModal();
            
            try {
                // Aquí redirigir al quiz_runner con parámetros del torneo
                // Por ahora simulamos que se juega y se envía puntaje
                showToast('🎮 Redirigiendo al juego...');
                
                // Simular juego y envío de puntaje
                setTimeout(async () => {
                    const puntajeSimulado = Math.floor(Math.random() * 100) + 50;
                    const data = await apiRequest('/torneos/' + torneoId + '/jugar', {
                        method: 'POST',
                        body: JSON.stringify({ puntaje: puntajeSimulado })
                    });
                    
                    if (data.success) {
                        showToast(`✅ Partida completada: +${puntajeSimulado} pts. Total: ${data.puntajeTotal}`);
                        loadTorneoDetalle();
                    } else {
                        showToast('❌ ' + data.error, 'error');
                    }
                }, 1000);
            } catch (error) {
                console.error('Error:', error);
                showToast('❌ Error al jugar', 'error');
            }
        }

        async function loadTorneoDetalle() {
            if (!checkAuth()) return;
            const torneoId = getTorneoId();
            if (!torneoId) { window.location.href = 'torneos.html'; return; }

            try {
                const data = await apiRequest('/torneos/' + torneoId);
                if (data.success) {
                    renderTournamentHeader(data.torneo);
                    renderRanking(data.torneo.ranking, false, data.torneo.miInscripcion);
                    renderMyStats(data.torneo, data.torneo.miInscripcion);
                } else {
                    throw new Error(data.error);
                }
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('rankingContainer').innerHTML = '<div class="empty-ranking"><img src="img/incorrect.png" class="icon-btn"><h3>Error al cargar</h3><p>Intenta recargar la página</p></div>';
            }
        }

        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            toast.style.cssText = `
                position: fixed; bottom: 24px; right: 24px; z-index: 9999;
                padding: 16px 24px; border-radius: 12px; font-weight: 600;
                background: ${type === 'success' ? '#48bb78' : '#fc8181'};
                color: white; box-shadow: 0 10px 30px rgba(0,0,0,0.2);
                animation: slideIn 0.3s ease;
            `;
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => { toast.style.opacity = '0'; toast.style.transition = 'opacity 0.3s'; setTimeout(() => toast.remove(), 300); }, 3000);
        }

        // Actualizar countdown cada segundo
        setInterval(() => {
            const timer = document.getElementById('countdownTimer');
            if (timer) {
                const torneoId = getTorneoId();
                // Recargar cada 30s para actualizar countdown
            }
        }, 1000);

        // Recargar cada 30 segundos
        setInterval(loadTorneoDetalle, 30000);

        document.addEventListener('DOMContentLoaded', loadTorneoDetalle);
    </script>
    <style>
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    </style>
    <script src="js/sabi_injector.js"></script>
</body>
</html>
