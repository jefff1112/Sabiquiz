<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sabiquiz - Ranking</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        /* ============================================
           RESET Y BASE
           ============================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        /* ============================================
           CONTENEDOR PRINCIPAL - MÁS GRANDE
           ============================================ */
        .leaderboard-container {
            max-width: 1000px;
            width: 100%;
            background: white;
            border-radius: 30px;
            padding: 45px 50px 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
            transition: all 0.3s ease;
        }

        /* ============================================
           TÍTULOS
           ============================================ */
        .leaderboard-container h1 {
            text-align: center;
            color: #2d3748;
            font-size: 38px;
            font-weight: 800;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .leaderboard-container .subtitle {
            text-align: center;
            color: #a0aec0;
            font-size: 18px;
            font-weight: 500;
            margin-bottom: 35px;
            letter-spacing: 0.5px;
        }

        /* ============================================
           TOP 3 - PODIO MEJORADO
           ============================================ */
        .podium-container {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 30px;
            margin: 20px 0 45px;
            min-height: 300px;
            flex-wrap: wrap;
        }

        .card {
            background: #f7fafc;
            border-radius: 20px;
            padding: 25px 20px 20px;
            text-align: center;
            width: 180px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            border: 3px solid #e2e8f0;
            position: relative;
        }

        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.12);
        }

        /* ORO - 1er Lugar */
        .card.rank-1 {
            border-color: #FFD700;
            background: linear-gradient(180deg, #FFFDE7 0%, #FFF8E1 100%);
            order: 2;
            padding-bottom: 35px;
            transform: scale(1.08);
            box-shadow: 0 8px 30px rgba(255, 215, 0, 0.25);
        }
        .card.rank-1:hover {
            transform: scale(1.1);
        }

        /* PLATA - 2do Lugar */
        .card.rank-2 {
            border-color: #C0C0C0;
            background: linear-gradient(180deg, #F8F9FA 0%, #F1F3F5 100%);
            order: 1;
            padding-bottom: 25px;
        }

        /* BRONCE - 3er Lugar */
        .card.rank-3 {
            border-color: #CD7F32;
            background: linear-gradient(180deg, #FDF6F0 0%, #F8EDE3 100%);
            order: 3;
            padding-bottom: 20px;
        }

        .card .medal {
            font-size: 48px;
            display: block;
            margin-bottom: 2px;
        }

        .card .card-rank {
            font-size: 16px;
            font-weight: 600;
            color: #718096;
            margin-bottom: 4px;
        }

        .card .card-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 3px solid #667eea;
            object-fit: cover;
            margin: 8px auto 12px;
            display: block;
            background: #edf2f7;
        }

        .card .player-name {
            font-weight: 700;
            font-size: 20px;
            color: #2d3748;
            margin: 6px 0 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card .player-stats {
            font-size: 15px;
            color: #4a5568;
            margin: 3px 0;
        }

        .card .player-stats strong {
            color: #2d3748;
            font-weight: 700;
        }

        .card .crown {
            font-size: 32px;
            display: block;
            margin-bottom: -8px;
        }

        /* ============================================
           RANKING GENERAL (4 - 10)
           ============================================ */
        .others-title {
            color: #2d3748;
            margin: 10px 0 18px;
            border-bottom: 2px solid #edf2f7;
            padding-bottom: 14px;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 0.3px;
        }

        .others-title span {
            color: #667eea;
        }

        .others-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 35px;
        }

        .leaderboard-row {
            display: flex;
            align-items: center;
            padding: 14px 22px;
            background: #f7fafc;
            border-radius: 14px;
            transition: background 0.2s ease, transform 0.2s ease;
            gap: 18px;
            border: 1px solid transparent;
        }

        .leaderboard-row:hover {
            background: #edf2f7;
            border-color: #e2e8f0;
            transform: translateX(4px);
        }

        .leaderboard-row .row-rank {
            font-weight: 700;
            color: #4a5568;
            min-width: 45px;
            font-size: 17px;
        }

        .leaderboard-row .row-player-info {
            display: flex;
            align-items: center;
            gap: 14px;
            flex: 1;
        }

        .leaderboard-row .avatar-small {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 2px solid #667eea;
            object-fit: cover;
            background: #edf2f7;
        }

        .leaderboard-row .player-name {
            font-weight: 600;
            color: #2d3748;
            font-size: 17px;
        }

        .leaderboard-row .row-stat {
            color: #4a5568;
            min-width: 90px;
            text-align: center;
            font-size: 16px;
        }

        .leaderboard-row .row-stat strong {
            color: #2d3748;
            font-weight: 700;
        }

        /* ============================================
           BOTÓN VOLVER
           ============================================ */
        .btn-back {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            letter-spacing: 0.5px;
        }

        .btn-back:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }

        .btn-back:active {
            transform: translateY(0);
        }

        /* ============================================
           MENSAJES Y ESTADOS
           ============================================ */
        .loading-text {
            text-align: center;
            color: #a0aec0;
            padding: 50px;
            font-size: 20px;
            font-weight: 500;
            width: 100%;
        }

        .error-message {
            background: #fed7d7;
            color: #c53030;
            padding: 16px 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: none;
            text-align: center;
            font-weight: 600;
        }

        .debug-info {
            background: #ebf4ff;
            padding: 12px 18px;
            border-radius: 10px;
            margin: 10px 0 20px;
            font-size: 14px;
            color: #4a5568;
            display: none;
            border-left: 4px solid #667eea;
        }

        .empty-message {
            text-align: center;
            color: #a0aec0;
            padding: 50px;
            font-size: 20px;
            width: 100%;
        }

        /* ============================================
           RESPONSIVE - PROFESIONAL
           ============================================ */
        @media (max-width: 820px) {
            .leaderboard-container {
                padding: 30px 25px 30px;
                border-radius: 24px;
            }

            .leaderboard-container h1 {
                font-size: 30px;
            }

            .podium-container {
                gap: 20px;
                min-height: 250px;
            }

            .card {
                width: 150px;
                padding: 20px 15px 15px;
            }

            .card .card-avatar {
                width: 65px;
                height: 65px;
            }

            .card .player-name {
                font-size: 17px;
            }

            .card.rank-1 {
                transform: scale(1.05);
            }
            .card.rank-1:hover {
                transform: scale(1.07);
            }

            .leaderboard-row {
                padding: 12px 16px;
                gap: 12px;
            }

            .leaderboard-row .row-stat {
                min-width: 70px;
                font-size: 14px;
            }

            .leaderboard-row .player-name {
                font-size: 15px;
            }

            .leaderboard-row .avatar-small {
                width: 36px;
                height: 36px;
            }
        }

        @media (max-width: 600px) {
            body {
                padding: 15px;
            }

            .leaderboard-container {
                padding: 20px 16px 25px;
                border-radius: 20px;
            }

            .leaderboard-container h1 {
                font-size: 26px;
            }

            .leaderboard-container .subtitle {
                font-size: 15px;
                margin-bottom: 25px;
            }

            .podium-container {
                flex-direction: column;
                align-items: center;
                gap: 16px;
                min-height: auto;
                margin-bottom: 30px;
            }

            .card {
                width: 100%;
                max-width: 260px;
                padding: 18px 16px;
            }

            .card.rank-1 {
                order: 1;
                transform: none;
                padding-bottom: 20px;
            }
            .card.rank-1:hover {
                transform: none;
            }
            .card.rank-2 {
                order: 2;
            }
            .card.rank-3 {
                order: 3;
            }

            .card .card-avatar {
                width: 60px;
                height: 60px;
            }

            .card .player-name {
                font-size: 18px;
            }

            .others-title {
                font-size: 20px;
                margin-top: 5px;
            }

            .leaderboard-row {
                flex-wrap: wrap;
                gap: 6px 12px;
                padding: 12px 14px;
                border-radius: 12px;
            }

            .leaderboard-row .row-rank {
                min-width: 35px;
                font-size: 15px;
            }

            .leaderboard-row .row-player-info {
                flex: 1 1 100%;
                gap: 10px;
            }

            .leaderboard-row .player-name {
                font-size: 15px;
            }

            .leaderboard-row .avatar-small {
                width: 32px;
                height: 32px;
            }

            .leaderboard-row .row-stat {
                min-width: 50px;
                font-size: 13px;
                flex: 1;
                text-align: left;
            }

            .btn-back {
                font-size: 16px;
                padding: 14px;
                border-radius: 12px;
            }

            .loading-text {
                padding: 30px 15px;
                font-size: 17px;
            }

            .empty-message {
                padding: 30px 15px;
                font-size: 17px;
            }
        }

        @media (max-width: 400px) {
            .leaderboard-container {
                padding: 15px 12px 20px;
                border-radius: 16px;
            }

            .leaderboard-container h1 {
                font-size: 22px;
            }

            .card {
                padding: 14px 12px;
            }

            .card .card-avatar {
                width: 50px;
                height: 50px;
            }

            .card .player-name {
                font-size: 16px;
            }

            .card .player-stats {
                font-size: 13px;
            }

            .leaderboard-row {
                padding: 10px 12px;
            }

            .leaderboard-row .player-name {
                font-size: 14px;
            }

            .leaderboard-row .row-stat {
                font-size: 12px;
                min-width: 40px;
            }
        }
    </style>
</head>
<body>
    <div class="leaderboard-container">
        <!-- TÍTULO -->
        <h1>🏆 Tabla de Clasificación</h1>
        <p class="subtitle">¡Los mejores jugadores de SabiQuiz!</p>

        <!-- MENSAJES -->
        <div id="errorMessage" class="error-message"></div>
        <div id="debugInfo" class="debug-info"></div>

        <!-- TOP 3 -->
        <div id="leaderboard-top3" class="podium-container">
            <div class="loading-text">⏳ Cargando ranking...</div>
        </div>

        <!-- RANKING 4-10 -->
        <h2 class="others-title">📋 Ranking General <span>(4 - 10)</span></h2>
        <div id="leaderboard-others" class="others-container">
            <div class="loading-text">⏳ Cargando...</div>
        </div>

        <!-- BOTÓN VOLVER -->
        <button id="backToMenuBtn" class="btn-back">← Volver al Menú</button>
    </div>

    <script>
        // ============================================
        // CONFIGURACIÓN
        // ============================================
        const API_URL = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') ? 'http://localhost:3000/api' : (window.location.origin + '/api');
        function verificarAutenticacion() {
    const token = localStorage.getItem('token');
    if (!token) {
        window.location.href = 'login.html';
        return false;
    }
    return true;
}

document.addEventListener('DOMContentLoaded', () => {
    if (!verificarAutenticacion()) return;
    // ... resto del código
});

        // ============================================
        // AUTENTICACIÓN
        // ============================================
        function getToken() {
            return localStorage.getItem('token');
        }

        function checkAuth() {
            const token = getToken();
            if (!token) {
                window.location.href = 'login.html';
                return false;
            }
            return true;
        }

        // ============================================
        // PETICIÓN A LA API
        // ============================================
        async function apiRequest(endpoint) {
            const token = getToken();
            const headers = {
                'Content-Type': 'application/json',
                'Authorization': token ? `Bearer ${token}` : ''
            };

            const response = await fetch(`${API_URL}${endpoint}`, { headers });
            if (!response.ok) {
                if (response.status === 401) {
                    localStorage.removeItem('token');
                    localStorage.removeItem('user');
                    window.location.href = 'login.html';
                }
                const data = await response.json();
                throw new Error(data.error || `Error ${response.status}`);
            }
            return await response.json();
        }

        function showError(msg) {
            const el = document.getElementById('errorMessage');
            el.textContent = msg;
            el.style.display = 'block';
        }

        function showDebug(msg) {
            const el = document.getElementById('debugInfo');
            el.textContent = msg;
            el.style.display = 'block';
        }

        // ============================================
        // RENDERIZAR RANKING
        // ============================================
        async function fetchLeaderboard() {
            const top3Container = document.getElementById('leaderboard-top3');
            const othersContainer = document.getElementById('leaderboard-others');
            const othersTitle = document.querySelector('.others-title');

            try {
                if (!checkAuth()) return;

                document.getElementById('errorMessage').style.display = 'none';
                top3Container.innerHTML = '<div class="loading-text">⏳ Cargando ranking...</div>';
                othersContainer.innerHTML = '<div class="loading-text">⏳ Cargando...</div>';

                showDebug('🔍 Solicitando ranking...');
                const data = await apiRequest('/auth/ranking');
                showDebug(`✅ ${data.ranking?.length || 0} jugadores encontrados`);

                if (!data.success || !data.ranking || data.ranking.length === 0) {
                    top3Container.innerHTML = '<div class="empty-message">😕 Aún no hay jugadores en el ranking</div>';
                    othersTitle.style.display = 'none';
                    return;
                }

                const players = data.ranking;

                // ============================================
                // TOP 3
                // ============================================
                top3Container.innerHTML = '';
                const top3 = players.slice(0, 3);
                const medallas = ['🥇', '🥈', '🥉'];
                const coronas = ['👑', '', ''];

                top3.forEach((player, index) => {
                    const rank = index + 1;
                    const card = document.createElement('div');
                    card.className = `card rank-${rank}`;
                    card.innerHTML = `
                        <span class="crown">${coronas[index]}</span>
                        <span class="medal">${medallas[index]}</span>
                        <div class="card-rank">#${rank}</div>
                        <img src="${player.photoURL || 'img/default-avatar.png'}" class="card-avatar" 
                             onerror="this.src='img/default-avatar.png'">
                        <div class="player-name">${player.displayName || player.username || 'Jugador'}</div>
                        <div class="player-stats">🎯 Nivel: <strong>${player.level || 1}</strong></div>
                        <div class="player-stats">⭐ XP: <strong>${player.totalXp || 0}</strong></div>
                    `;
                    top3Container.appendChild(card);
                });

                // ============================================
                // RANKING 4-10
                // ============================================
                othersContainer.innerHTML = '';
                if (players.length > 3) {
                    othersTitle.style.display = 'block';
                    const others = players.slice(3);

                    others.forEach((player, index) => {
                        const rank = index + 4;
                        const row = document.createElement('div');
                        row.className = 'leaderboard-row';
                        row.innerHTML = `
                            <div class="row-rank">#${rank}</div>
                            <div class="row-player-info">
                                <img src="${player.photoURL || 'img/default-avatar.png'}" class="avatar-small" 
                                     onerror="this.src='img/default-avatar.png'">
                                <span class="player-name">${player.displayName || player.username || 'Jugador'}</span>
                            </div>
                            <div class="row-stat"><strong>${player.level || 1}</strong> Nivel</div>
                            <div class="row-stat"><strong>${player.totalXp || 0}</strong> XP</div>
                        `;
                        othersContainer.appendChild(row);
                    });
                } else {
                    othersTitle.style.display = 'none';
                }

                showDebug(`✅ Ranking mostrado: ${players.length} jugadores`);

            } catch (error) {
                console.error('❌ Error:', error);
                showError('❌ ' + error.message);
                top3Container.innerHTML = `
                    <div class="empty-message">
                        ❌ Error al cargar el ranking<br>
                        <small style="font-size:14px;color:#a0aec0;">${error.message}</small>
                        <br><br>
                        <button onclick="fetchLeaderboard()" style="padding:12px 28px;border:none;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:#fff;border-radius:10px;cursor:pointer;font-weight:700;font-size:16px;transition:transform 0.2s;">
                            🔄 Reintentar
                        </button>
                    </div>
                `;
            }
        }

        // ============================================
        // INICIALIZAR
        // ============================================
        document.addEventListener('DOMContentLoaded', () => {
            if (!checkAuth()) return;
            fetchLeaderboard();
            document.getElementById('backToMenuBtn').addEventListener('click', () => {
                window.location.href = 'main_menu.html';
            });
        });

        window.fetchLeaderboard = fetchLeaderboard;
    </script>
</body>
</html>
