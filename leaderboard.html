<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sabiquiz - Ranking</title>
    <link rel="stylesheet" href="css/design-system.css">
    <link rel="stylesheet" href="css/navbar.css">
    <script src="https://cdn.jsdelivr.net/npm/animejs@3.2.1/lib/anime.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
</head>
<body>
    <div id="navbar-container"></div>
    
    <main class="main-content">
        <div class="container-wide">
            <!-- BREADCRUMB -->
            <nav class="breadcrumb" aria-label="Navegación">
                <a href="main_menu.html">Inicio</a>
                <span class="separator">/</span>
                <span aria-current="page">Ranking</span>
            </nav>

            <!-- HEADER -->
            <header class="dashboard-header animate-in">
                <h1>🏆 Tabla de Clasificación</h1>
                <p class="muted">Los mejores jugadores de SabiQuiz</p>
            </header>

            <!-- FILTERS -->
            <div class="card animate-in animate-delay-1">
                <div class="tabs" id="rankingTabs" role="tablist">
                    <button class="tab active" data-tab="total" role="tab" aria-selected="true">Total</button>
                    <button class="tab" data-tab="semanal" role="tab" aria-selected="false">Semanal</button>
                    <button class="tab" data-tab="mensual" role="tab" aria-selected="false">Mensual</button>
                </div>
                
                <div style="margin-top: var(--space-4);">
                    <input type="text" class="form-input" id="searchUser" placeholder="🔍 Buscar jugador..." style="max-width: 300px;">
                </div>
            </div>

            <!-- TOP 3 PODIUM -->
            <section class="podium-section animate-in animate-delay-2" id="podiumSection">
                <div class="podium-container" id="podiumContainer">
                    <!-- Top 3 will be rendered here -->
                </div>
            </section>

            <!-- RANKING TABLE -->
            <section class="ranking-section animate-in animate-delay-3">
                <div class="section-header">
                    <h2>Ranking General</h2>
                </div>
                
                <div class="card" style="overflow-x: auto;">
                    <table class="ranking-table" id="rankingTable">
                        <thead>
                            <tr>
                                <th scope="col">#</th>
                                <th scope="col">Jugador</th>
                                <th scope="col">Nivel</th>
                                <th scope="col">XP</th>
                                <th scope="col">⭐ Estrellas</th>
                                <th scope="col">Materia Fuerte</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Rows will be rendered here -->
                        </tbody>
                    </table>
                </div>

                <!-- PAGINATION -->
                <nav class="pagination" id="pagination" aria-label="Paginación del ranking" style="display: flex; justify-content: center; gap: var(--space-2); margin-top: var(--space-6);">
                    <!-- Pagination buttons -->
                </nav>
            </section>
        </div>
    </main>

    <script src="js/layout.js"></script>
    <script src="js/sabi_injector.js"></script>
    <script>
        // ============================================
        // CONFIGURACIÓN
        // ============================================
        const API_URL = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') ? 'http://localhost:3000/api' : (window.location.origin + '/api');

        function getToken() {
            return localStorage.getItem('token');
        }

        function checkAuth() {
            const token = getToken();
            if (!token) {
                window.location.href = 'login.html';
                return false;
            }
            return true;
        }

        async function apiRequest(endpoint) {
            const token = getToken();
            const headers = {
                'Content-Type': 'application/json',
                'Authorization': token ? `Bearer ${token}` : ''
            };

            const response = await fetch(`${API_URL}${endpoint}`, { headers });
            if (!response.ok) {
                if (response.status === 401) {
                    localStorage.removeItem('token');
                    localStorage.removeItem('user');
                    window.location.href = 'login.html';
                }
                throw new Error(await response.text());
            }
            return await response.json();
        }

        // ============================================
        // RENDERIZAR RANKING
        // ============================================
        let currentPeriod = 'total';
        let currentPage = 1;
        const PER_PAGE = 10;
        let allPlayers = [];

        async function fetchLeaderboard(period = 'total') {
            const podiumContainer = document.getElementById('podiumContainer');
            const tbody = document.querySelector('#rankingTable tbody');
            const pagination = document.getElementById('pagination');

            try {
                if (!checkAuth()) return;

                podiumContainer.innerHTML = '<div class="loading-text" style="text-align:center;padding:40px;">⏳ Cargando ranking...</div>';
                tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:40px;">⏳ Cargando...</td></tr>';

                const data = await apiRequest(`/auth/ranking?period=${period}`);
                
                if (!data.success || !data.ranking || data.ranking.length === 0) {
                    podiumContainer.innerHTML = '<div class="empty-message" style="text-align:center;padding:40px;">😴 Aún no hay jugadores en el ranking</div>';
                    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:40px;">No hay datos</td></tr>';
                    return;
                }

                allPlayers = data.ranking;
                renderPodium(allPlayers.slice(0, 3));
                renderTable(allPlayers);
                renderPagination();

            } catch (error) {
                console.error('❌ Error:', error);
                podiumContainer.innerHTML = `<div class="empty-message" style="text-align:center;padding:40px;">❌ Error al cargar el ranking<br><small style="color:var(--color-text-muted)">${error.message}</small></div>`;
            }
        }

        function renderPodium(top3) {
            const podiumContainer = document.getElementById('podiumContainer');
            podiumContainer.innerHTML = '';

            const medals = ['🥇', '🥈', '🥉'];
            const crowns = ['👑', '', ''];

            top3.forEach((player, index) => {
                const rank = index + 1;
                const card = document.createElement('div');
                card.className = `card podium-card rank-${rank}`;
                card.style.cssText = `
                    background: var(--color-surface);
                    border: 2px solid var(--color-border);
                    border-radius: var(--radius-xl);
                    padding: var(--space-6);
                    text-align: center;
                    min-width: 180px;
                    flex: 1;
                    position: relative;
                    transition: all var(--transition-base);
                `;
                
                if (rank === 1) {
                    card.style.borderColor = '#f59e0b';
                    card.style.boxShadow = '0 12px 32px rgba(245, 158, 11, 0.2)';
                } else if (rank === 2) {
                    card.style.borderColor = '#9ca3af';
                } else if (rank === 3) {
                    card.style.borderColor = '#d97706';
                }

                card.innerHTML = `
                    <div style="font-size: 48px; margin-bottom: var(--space-2);">${crowns[index]}</div>
                    <div style="font-size: 48px; margin-bottom: var(--space-2);">${medals[index]}</div>
                    <img src="${player.photoURL || 'img/default-avatar.png'}" class="avatar avatar-xl" style="margin: 0 auto var(--space-3); width: 80px; height: 80px;" onerror="this.src='img/default-avatar.png'">
                    <div class="h3" style="color: var(--color-text);">${player.displayName || player.username || 'Jugador'}</div>
                    <div class="text-muted" style="margin-top: var(--space-2);">
                        <div>🚀 Nivel: <strong>${player.level || 1}</strong></div>
                        <div>⭐ XP: <strong>${player.totalXp || 0}</strong></div>
                    </div>
                `;
                podiumContainer.appendChild(card);
            });
        }

        function renderTable(players) {
            const tbody = document.querySelector('#rankingTable tbody');
            const searchTerm = document.getElementById('searchUser').value.toLowerCase();
            
            let filtered = players;
            if (searchTerm) {
                filtered = players.filter(p => 
                    (p.displayName || p.username || '').toLowerCase().includes(searchTerm)
                );
            }

            const start = (currentPage - 1) * PER_PAGE;
            const end = start + PER_PAGE;
            const pagePlayers = filtered.slice(start, end);

            if (pagePlayers.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:40px;">No hay jugadores</td></tr>';
                return;
            }

            tbody.innerHTML = '';
            pagePlayers.forEach((player, index) => {
                const rank = start + index + 1;
                const row = document.createElement('tr');
                row.style.cssText = `
                    border-bottom: 1px solid var(--color-border);
                    transition: background-color var(--transition-fast);
                `;
                
                const materiaFuerte = player.materia_fuerte || '-';
                const avatar = player.photoURL || 'img/default-avatar.png';
                
                row.innerHTML = `
                    <td style="padding: var(--space-4); font-weight: 700; color: var(--color-text-muted);">#${rank}</td>
                    <td style="padding: var(--space-4);">
                        <div style="display: flex; align-items: center; gap: var(--space-3);">
                            <img src="${avatar}" class="avatar avatar-sm" onerror="this.src='img/default-avatar.png'">
                            <span style="font-weight: 600; color: var(--color-text);">${player.displayName || player.username || 'Jugador'}</span>
                        </div>
                    </td>
                    <td style="padding: var(--space-4); text-align: center;">
                        <span class="badge badge-primary">${player.level || 1}</span>
                    </td>
                    <td style="padding: var(--space-4); text-align: center; font-weight: 600; color: var(--color-text);">${player.totalXp || 0}</td>
                    <td style="padding: var(--space-4); text-align: center; color: var(--color-accent-amber); font-weight: 600;">${player.totalEstrellas || 0}</td>
                    <td style="padding: var(--space-4); text-align: center; color: var(--color-text-muted);">${materiaFuerte}</td>
                `;
                
                row.addEventListener('mouseenter', () => {
                    row.style.backgroundColor = 'var(--color-primary-50)';
                });
                row.addEventListener('mouseleave', () => {
                    row.style.backgroundColor = '';
                });
                
                tbody.appendChild(row);
            });

            // Ocultar filas después de la página actual si no hay filtro
            if (!searchTerm) {
                renderPagination(filtered.length);
            }
        }

        function renderPagination(total = allPlayers.length) {
            const pagination = document.getElementById('pagination');
            const totalPages = Math.ceil(total / PER_PAGE);
            
            if (totalPages <= 1) {
                pagination.innerHTML = '';
                return;
            }

            let html = '';
            
            // Previous button
            html += `<button class="btn btn-ghost btn-sm" ${currentPage === 1 ? 'disabled' : ''} onclick="changePage(${currentPage - 1})">‹ Anterior</button>`;
            
            // Page numbers
            for (let i = 1; i <= totalPages; i++) {
                if (i === 1 || i === totalPages || (i >= currentPage - 1 && i <= currentPage + 1)) {
                    html += `<button class="btn ${i === currentPage ? 'btn-primary' : 'btn-ghost'} btn-sm" onclick="changePage(${i})">${i}</button>`;
                } else if (i === currentPage - 2 || i === currentPage + 2) {
                    html += `<span style="display: flex; align-items: center; padding: 0 var(--space-2); color: var(--color-text-muted);">...</span>`;
                }
            }
            
            // Next button
            html += `<button class="btn btn-ghost btn-sm" ${currentPage === totalPages ? 'disabled' : ''} onclick="changePage(${currentPage + 1})">Siguiente ›</button>`;
            
            pagination.innerHTML = html;
        }

        function changePage(page) {
            const totalPages = Math.ceil(allPlayers.length / PER_PAGE);
            if (page < 1 || page > totalPages) return;
            currentPage = page;
            renderTable(allPlayers);
            
            // Scroll to top of table
            document.querySelector('.ranking-section').scrollIntoView({ behavior: 'smooth' });
        }

        // ============================================
        // EVENT LISTENERS
        // ============================================
        document.addEventListener('DOMContentLoaded', () => {
            if (!checkAuth()) return;
            
            fetchLeaderboard(currentPeriod);
            
            // Tabs
            document.querySelectorAll('#rankingTabs .tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    document.querySelectorAll('#rankingTabs .tab').forEach(t => {
                        t.classList.remove('active');
                        t.setAttribute('aria-selected', 'false');
                    });
                    tab.classList.add('active');
                    tab.setAttribute('aria-selected', 'true');
                    currentPeriod = tab.dataset.tab;
                    currentPage = 1;
                    fetchLeaderboard(currentPeriod);
                });
            });
            
            // Search
            document.getElementById('searchUser')?.addEventListener('input', (e) => {
                currentPage = 1;
                renderTable(allPlayers);
            });
            
            // Animaciones de entrada
            anime({
                targets: '.animate-in',
                translateY: [20, 0],
                opacity: [0, 1],
                duration: 600,
                easing: 'easeOutQuad',
                delay: anime.stagger(100, {start: 200})
            });
        });
    </script>
</body>
</html>
